name: Test Magis 6.3.0 resource-only patch

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resource-patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Download exact Magis 6.3.0 and Apktool
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4 --retry-all-errors -A 'Mozilla/5.0' \
            'https://magisapktv.com/files/magis-celular-magisapktv.com.apk' -o magis-original.apk
          echo 'd4edfc8ee9fbc008f9daa2cbb3aac733939987b7570bfc58a7065ebecfaa510a  magis-original.apk' | sha256sum -c -
          curl -fL --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar' -o apktool.jar

      - name: Install Android build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'build-tools;36.0.0'
          echo "BT=$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_ENV"

      - name: Create isolated test signing key
        shell: bash
        run: |
          keytool -genkeypair -v -keystore test.jks -storepass android -keypass android \
            -alias test -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Magis Resource Test,O=Local Test,C=MX'

      - name: Build no-op re-signed control
        shell: bash
        run: |
          set -euxo pipefail
          cp magis-original.apk noop-unsigned.apk
          zip -d noop-unsigned.apk 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/*.SF' 'META-INF/MANIFEST.MF' || true
          "$BT/zipalign" -f -p 4 noop-unsigned.apk noop-aligned.apk
          "$BT/apksigner" sign --ks test.jks --ks-pass pass:android --key-pass pass:android --out magis-noop-resigned.apk noop-aligned.apk
          "$BT/apksigner" verify --verbose magis-noop-resigned.apk

      - name: Decode and patch only update-dialog resources
        shell: bash
        run: |
          set -euxo pipefail
          java -jar apktool.jar d -f magis-original.apk -o magis-dec
          python3 - <<'PY'
          from pathlib import Path
          targets=[
            Path('magis-dec/res/layout/dialog_force_upgrade.xml'),
            Path('magis-dec/res/layout/dialog_force_upgrade_exception.xml'),
            Path('magis-dec/res/layout/dialog_version_forbidden.xml'),
          ]
          close='''\n    <ImageView\n        android:layout_gravity="right"\n        android:id="@id/ivClose"\n        android:padding="20px"\n        android:layout_width="80px"\n        android:layout_height="80px"\n        android:src="@drawable/icon_close"/>\n'''
          for p in targets:
              txt=p.read_text(encoding='utf-8')
              if '@id/ivClose' in txt or '@+id/ivClose' in txt:
                  continue
              pos=txt.find('>')+1
              txt=txt[:pos]+close+txt[pos:]
              p.write_text(txt,encoding='utf-8')
              print('patched',p)
          PY
          java -jar apktool.jar b magis-dec -o magis-resource-unsigned.apk
          "$BT/zipalign" -f -p 4 magis-resource-unsigned.apk magis-resource-aligned.apk
          "$BT/apksigner" sign --ks test.jks --ks-pass pass:android --key-pass pass:android --out magis-resource-close-test.apk magis-resource-aligned.apk
          "$BT/apksigner" verify --verbose magis-resource-close-test.apk

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Compare original, no-op and resource patch on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -eux
            mkdir -p diagnostics
            PKG='com.msandroid.mobile'
            ACT='com.mobile.iptv.activity.SplashAty'
            test_case() {
              name="$1"; apk="$2"
              adb uninstall "$PKG" >/dev/null 2>&1 || true
              adb logcat -c || true
              adb install -r "$apk" >"diagnostics/${name}-install.txt" 2>&1 || { echo "$name install_failed" | tee -a diagnostics/results.txt; return; }
              adb shell am force-stop "$PKG" || true
              adb shell am start -W -n "$PKG/$ACT" >"diagnostics/${name}-start.txt" 2>&1 || true
              sleep 12
              p1=$(adb shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)
              sleep 20
              p2=$(adb shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)
              echo "$name pid12=${p1:-DEAD} pid32=${p2:-DEAD}" | tee -a diagnostics/results.txt
              adb exec-out screencap -p >"diagnostics/${name}.png" || true
              adb shell uiautomator dump /sdcard/${name}.xml >/dev/null 2>&1 || true
              adb pull /sdcard/${name}.xml "diagnostics/${name}.xml" >/dev/null 2>&1 || true
              adb logcat -d -v threadtime >"diagnostics/${name}-logcat.txt" 2>&1 || true
            }
            test_case original magis-original.apk
            test_case noop magis-noop-resigned.apk
            test_case resource magis-resource-close-test.apk
            cat diagnostics/results.txt

      - name: Upload diagnostics and candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magis-630-resource-patch-test
          retention-days: 7
          if-no-files-found: warn
          path: |
            diagnostics/**
            magis-noop-resigned.apk
            magis-resource-close-test.apk
