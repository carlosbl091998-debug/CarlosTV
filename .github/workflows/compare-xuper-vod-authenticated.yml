name: Compare Xuper VOD authenticated

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/compare-xuper-vod-authenticated.yml'

jobs:
  compare-vod:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      XUPER_USER: ${{ secrets.XUPER_USER }}
      XUPER_PASS: ${{ secrets.XUPER_PASS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Verify credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$XUPER_USER" || { echo 'XUPER_USER secret is missing'; exit 2; }
          test -n "$XUPER_PASS" || { echo 'XUPER_PASS secret is missing'; exit 2; }
          echo 'Authenticated test credentials are configured.'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Recover validated stable checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID=9623417943
          EXPECTED_SHA=8ba6eb4a13bdec2d8d8ab06a1502194f488ce58d9fb6de7feeb1c539ef0f7b4e
          mkdir -p /tmp/candidate
          curl -fL --retry 4 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/candidate.zip
          unzip -q /tmp/candidate.zip -d /tmp/candidate
          cp /tmp/candidate/Xuper-6.2.4-VOD-VersionIdentity-60505-655.apk Xuper-stable.apk
          echo "${EXPECTED_SHA}  Xuper-stable.apk" | sha256sum -c -

      - name: Run authenticated VOD probe on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/authenticated_vod_probe.sh Xuper-stable.apk

      - name: Upload authenticated diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuper-authenticated-vod-diagnostics-stable
          path: diagnostics-auth-vod/**
          retention-days: 3
          if-no-files-found: warn
