name: Test runtime019 secondary DEX
on:
  workflow_dispatch:
  push:
    branches: [magis-vod-runtime-dex-stable]
    paths: ['.github/workflows/test-runtime019-secondary-dex.yml']
jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PKG: com.msandroid.mobile
      BASE_SHA256: 8ba6eb4a13bdec2d8d8ab06a1502194f488ce58d9fb6de7feeb1c539ef0f7b4e
      RUNTIME_SHA256: 5d2a62ef889d0000000000000000000000000000000000000000000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Install build tools
        run: |
          sdkmanager 'build-tools;35.0.0' >/dev/null
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Recover exact stable and runtime DEX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/base /tmp/runtime diagnostics
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/carlosbl091998-debug/CarlosTV/actions/artifacts/9623417943/zip -o /tmp/base.zip
          unzip -q /tmp/base.zip -d /tmp/base
          BASE=''; while IFS= read -r f; do [ "$(sha256sum "$f"|awk '{print $1}')" = "$BASE_SHA256" ] && BASE="$f" && break; done < <(find /tmp/base -name '*.apk' -type f)
          test -n "$BASE"; cp "$BASE" stable.apk
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/carlosbl091998-debug/CarlosTV/actions/artifacts/9625098362/zip -o /tmp/runtime.zip
          unzip -p /tmp/runtime.zip dexdump/runtime-019-5d2a62ef889d.dex > runtime019.dex
          test "$(stat -c '%s' runtime019.dex)" = '9282224'
          sha256sum runtime019.dex | tee diagnostics/runtime019-sha.txt
      - name: Build signed secondary-DEX control
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          src='stable.apk'; out='control-unsigned.apk'
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(out,'w',allowZip64=True) as zout:
            for it in zin.infolist():
              if it.filename.startswith('META-INF/') or it.filename=='classes2.dex': continue
              data=zin.read(it.filename); ni=zipfile.ZipInfo(it.filename,it.date_time); ni.compress_type=it.compress_type; ni.extra=it.extra; ni.comment=it.comment; ni.internal_attr=it.internal_attr; ni.external_attr=it.external_attr; ni.create_system=it.create_system; zout.writestr(ni,data)
            ni=zipfile.ZipInfo('classes2.dex'); ni.compress_type=zipfile.ZIP_DEFLATED; zout.writestr(ni,open('runtime019.dex','rb').read())
          PY
          zipalign -P 16 -f 4 control-unsigned.apk control-aligned.apk
          keytool -genkeypair -keystore /tmp/key.jks -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US' >/dev/null 2>&1
          apksigner sign --ks /tmp/key.jks --ks-pass pass:android --key-pass pass:android --out Magis-stable-runtime019-control.apk control-aligned.apk
          apksigner verify --verbose Magis-stable-runtime019-control.apk | tee diagnostics/signature.txt
          unzip -t Magis-stable-runtime019-control.apk | tail -2 | tee diagnostics/zip.txt
          sha256sum stable.apk Magis-stable-runtime019-control.apk | tee diagnostics/apk-sha.txt
      - name: Write liveness test
        run: |
          cat > diagnostics/test.sh <<'BASH'
          #!/usr/bin/env bash
          set -u
          test_one(){ n=$1; a=$2; mkdir -p diagnostics/$n; adb uninstall "$PKG" >/dev/null 2>&1||true; adb install -g "$a"|tee diagnostics/$n/install.txt; grep -q Success diagnostics/$n/install.txt||return 2; adb logcat -c; adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >diagnostics/$n/launch.txt 2>&1||true; sleep 8; adb shell pidof "$PKG" >diagnostics/$n/pid8.txt||true; sleep 12; adb shell pidof "$PKG" >diagnostics/$n/pid20.txt||true; adb logcat -b crash -d -v threadtime >diagnostics/$n/crash.txt||true; [ -s diagnostics/$n/pid8.txt ]&&[ -s diagnostics/$n/pid20.txt ]; }
          s=0;c=0;test_one stable stable.apk||s=$?;test_one control Magis-stable-runtime019-control.apk||c=$?; echo "stable_rc=$s control_rc=$c"|tee diagnostics/summary.txt; [ "$s" -eq 0 ]&&[ "$c" -eq 0 ]
          BASH
          chmod +x diagnostics/test.sh; bash -n diagnostics/test.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'|sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
      - name: Android 16 stable vs runtime019 control
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash diagnostics/test.sh
      - name: Upload candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime019-secondary-dex-control
          path: |
            Magis-stable-runtime019-control.apk
            diagnostics/**
          retention-days: 7
