name: Test ARM64 Android 16 10-30-45

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-arm64-android16-10-30-45.yml'

jobs:
  arm64-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      ARTIFACT_ID: '9633216673'
      PACKAGE: com.msandroid.mobile
    steps:
      - uses: actions/checkout@v4

      - name: Verify native ARM64 host and install ADB
        shell: bash
        run: |
          set -euo pipefail
          uname -a | tee host-uname.txt
          test "$(uname -m)" = 'aarch64'
          sudo apt-get update -y
          sudo apt-get install -y adb
          adb version | tee adb-version.txt
          docker version | tee docker-version.txt

      - name: Recover candidate APK from GitHub artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p incoming diagnostics
          curl -fL --retry 4 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/candidate.zip
          unzip -q /tmp/candidate.zip -d incoming
          APK=$(find incoming -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" candidate.apk
          sha256sum candidate.apk | tee candidate-sha256.txt

      - name: Start Android 16 ARM64 redroid instance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics redroid-data
          docker pull redroid/redroid:16.0.0_64only-latest | tee diagnostics/docker-pull.txt
          docker run -d --rm --privileged \
            --name redroid16 \
            -v "$PWD/redroid-data:/data" \
            -p 5555:5555 \
            redroid/redroid:16.0.0_64only-latest \
            androidboot.redroid_width=1080 \
            androidboot.redroid_height=2400 \
            androidboot.redroid_dpi=420 \
            androidboot.redroid_gpu_mode=guest \
            | tee diagnostics/container-id.txt

          for i in $(seq 1 120); do
            adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            STATE=$(adb -s 127.0.0.1:5555 get-state 2>/dev/null || true)
            BOOT=$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$STATE" = 'device' ] && [ "$BOOT" = '1' ]; then break; fi
            sleep 2
          done
          adb -s 127.0.0.1:5555 get-state | tee diagnostics/adb-state.txt
          test "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed | tr -d '\r')" = '1'
          adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi | tee diagnostics/device-abi.txt
          grep -q '^arm64-v8a$' diagnostics/device-abi.txt
          adb -s 127.0.0.1:5555 shell getprop ro.build.version.sdk | tee diagnostics/sdk.txt
          grep -q '^36$' diagnostics/sdk.txt
          adb -s 127.0.0.1:5555 shell getprop ro.build.version.release | tee diagnostics/release.txt

      - name: Install launch and enforce 10 30 45 second liveness
        id: runtime
        shell: bash
        continue-on-error: true
        run: |
          set +e
          ADB='adb -s 127.0.0.1:5555'
          $ADB uninstall "$PACKAGE" >/dev/null 2>&1 || true
          $ADB install -g candidate.apk > diagnostics/install.txt 2>&1
          INSTALL_RC=$?
          cat diagnostics/install.txt
          if [ $INSTALL_RC -ne 0 ] || ! grep -q 'Success' diagnostics/install.txt; then
            echo INSTALL_FAIL > diagnostics/result.txt
            exit 1
          fi

          $ADB logcat -c
          $ADB shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1 > diagnostics/launch.txt 2>&1
          sleep 10
          $ADB shell pidof "$PACKAGE" | tr -d '\r[:space:]' > diagnostics/pid10.txt
          if [ ! -s diagnostics/pid10.txt ]; then echo FAIL_AT_10 > diagnostics/result.txt; exit 1; fi

          sleep 20
          $ADB shell pidof "$PACKAGE" | tr -d '\r[:space:]' > diagnostics/pid30.txt
          if [ ! -s diagnostics/pid30.txt ]; then echo FAIL_AT_30 > diagnostics/result.txt; exit 1; fi

          sleep 15
          $ADB shell pidof "$PACKAGE" | tr -d '\r[:space:]' > diagnostics/pid45.txt
          if [ ! -s diagnostics/pid45.txt ]; then echo FAIL_AT_45 > diagnostics/result.txt; exit 1; fi

          echo PASS_45 > diagnostics/result.txt

      - name: Capture diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          ADB='adb -s 127.0.0.1:5555'
          $ADB logcat -d -v threadtime > diagnostics/logcat-full.txt 2>&1 || true
          grep -Eai 'FATAL EXCEPTION|AndroidRuntime|SIGSEGV|signal 11|tombstone|UnsatisfiedLinkError|dlopen failed|linker|ijk|ffmpeg|libsdl|DEBUG' diagnostics/logcat-full.txt > diagnostics/logcat-crash.txt || true
          $ADB shell dumpsys activity activities > diagnostics/activities.txt 2>&1 || true
          $ADB shell dumpsys package "$PACKAGE" > diagnostics/package.txt 2>&1 || true
          $ADB shell pidof "$PACKAGE" > diagnostics/pid-final.txt 2>&1 || true
          docker logs redroid16 > diagnostics/redroid-container.txt 2>&1 || true
          cat diagnostics/result.txt 2>/dev/null || true

      - name: Upload native ARM64 diagnostics and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-arm64-api36-redroid-10-30-45
          path: |
            candidate.apk
            candidate-sha256.txt
            host-uname.txt
            adb-version.txt
            docker-version.txt
            diagnostics/**
          retention-days: 7

      - name: Fail if liveness did not pass
        if: always()
        shell: bash
        run: |
          test -f diagnostics/result.txt
          grep -q '^PASS_45$' diagnostics/result.txt
