name: Inspect VOD error path

on:
  push:
    branches: [ xuper-force-upgrade-smali-patch ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Recover exact stable APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/base
          curl -fL --retry 4 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/carlosbl091998-debug/CarlosTV/actions/artifacts/9623417943/zip' \
            -o /tmp/base.zip
          unzip -q /tmp/base.zip -d /tmp/base
          BASE=''
          while IFS= read -r f; do
            sha=$(sha256sum "$f" | awk '{print $1}')
            if [ "$sha" = '8ba6eb4a13bdec2d8d8ab06a1502194f488ce58d9fb6de7feeb1c539ef0f7b4e' ]; then BASE="$f"; break; fi
          done < <(find /tmp/base -type f -name '*.apk' -print)
          test -n "$BASE"
          cp "$BASE" stable.apk
      - name: Download apktool and decode
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o apktool.jar
          java -jar apktool.jar d -f stable.apk -o decoded
      - name: Trace StartPlayVOD error handling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          grep -RIn --include='*.smali' -E 'StartPlayVOD|startPlayVOD|ResultException|returnCode|errorMessage|getErrorMessage|getReturnCode' decoded > diagnostics/vod-core-hits.txt || true
          grep -RIn --include='*.smali' -B 35 -A 80 -E 'startPlayVOD|StartPlayVOD' decoded > diagnostics/vod-context.txt || true
          grep -RIn --include='*.smali' -E 'Toast;->makeText|AlertDialog|Dialog;->show|show\(\)V|setMessage|setText' decoded > diagnostics/ui-show-hits.txt || true
          grep -RIn -E 'upgrade|update|version|forbidden|unsupported|support|movie|series|playback|play' decoded/res/values* > diagnostics/resource-hits.txt || true
          grep -RIn --include='*.smali' -E 'upgrade|update|version|forbidden|unsupported|support' decoded > diagnostics/version-error-hits.txt || true
          python3 - <<'PY'
          from pathlib import Path
          hits=[]
          for p in Path('decoded').rglob('*.smali'):
              s=p.read_text(errors='ignore')
              if 'StartPlayVOD' in s or 'startPlayVOD' in s:
                  hits.append((str(p),s))
          with open('diagnostics/vod-files.txt','w') as f:
              for p,_ in hits: f.write(p+'\n')
          print('vod_files=', len(hits))
          PY
          echo '=== VOD FILES ==='
          cat diagnostics/vod-files.txt || true
          echo '=== VOD CORE HITS ==='
          head -300 diagnostics/vod-core-hits.txt || true
          echo '=== VERSION/ERROR HITS ==='
          head -300 diagnostics/version-error-hits.txt || true
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: vod-error-path-inspection
          retention-days: 7
          path: diagnostics/**
