name: Test original TV APK with mobile compatibility

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-compat-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Download exact Xuper 4.34.5 package mirror
        shell: bash
        run: |
          set -euxo pipefail
          PAGE='https://www.mediafire.com/file/azgvigddkzvrss4/Xuper_4.34.5_%28com.android.mgstv%29.apk/file'
          curl -fL --retry 3 -A 'Mozilla/5.0' "$PAGE" -o mf.html
          python3 - <<'PY' > direct.txt
          import html,re
          t=html.unescape(open('mf.html',encoding='utf-8',errors='ignore').read()).replace('\\/','/')
          for p in [r'id=[\"\']downloadButton[\"\'][^>]*href=[\"\']([^\"\']+)',r'href=[\"\']([^\"\']+)[\"\'][^>]*id=[\"\']downloadButton[\"\']']:
              m=re.search(p,t,re.I)
              if m:
                  print(m.group(1)); break
          PY
          test -s direct.txt
          curl -fL --retry 3 -A 'Mozilla/5.0' "$(cat direct.txt)" -o base.apk
          unzip -t base.apk >/dev/null

      - name: Verify exact user APK contents
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,sys,zipfile
          expected='165d2aeefe3bcc4b79c839708d82d41fd8e0dc6259acd3116cf8a3a00ea8c25f'
          with zipfile.ZipFile('base.apk') as z:
              names=sorted(n for n in z.namelist() if not n.upper().startswith('META-INF/'))
              h=hashlib.sha256()
              for n in names:
                  d=z.read(n); h.update(n.encode()+b'\0'+hashlib.sha256(d).digest())
              got=h.hexdigest()
              print('logical_sha256=',got)
              if got != expected: sys.exit('APK content mismatch')
          print('CONTENT_MATCH_OK')
          PY

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Test unmodified APK under Android 16 phone compatibility modes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -u
            PKG='com.android.mgstv'
            ACT='com.interactive.brasiliptv.ui.activity.WelcomeActivity'
            mkdir -p diagnostics
            adb install -r base.apk

            # Avoid permission dialogs obscuring the layout where Android permits it.
            for p in android.permission.READ_PHONE_STATE android.permission.READ_PHONE_NUMBERS android.permission.POST_NOTIFICATIONS android.permission.ACCESS_FINE_LOCATION android.permission.ACCESS_COARSE_LOCATION android.permission.READ_MEDIA_IMAGES android.permission.READ_MEDIA_VIDEO android.permission.RECORD_AUDIO; do
              adb shell pm grant "$PKG" "$p" >/dev/null 2>&1 || true
            done

            capture() {
              name="$1"
              adb shell am force-stop "$PKG" || true
              adb shell am start -W -n "$PKG/$ACT" > "diagnostics/${name}-start.txt" 2>&1 || true
              sleep 10
              adb exec-out screencap -p > "diagnostics/${name}.png" || true
              adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
              adb pull /sdcard/window.xml "diagnostics/${name}-ui.xml" >/dev/null 2>&1 || true
              adb shell dumpsys window windows | grep -E 'mCurrentFocus|mFocusedApp' > "diagnostics/${name}-focus.txt" || true
              pid=$(adb shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)
              printf '%s pid=%s\n' "$name" "${pid:-DEAD}" | tee -a diagnostics/results.txt
            }

            # Baseline: untouched APK and untouched compatibility behavior.
            adb shell am compat reset-all "$PKG" >/dev/null 2>&1 || true
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            capture baseline_landscape

            # Let Android resize the original TV activity without altering the APK.
            adb shell am compat enable FORCE_RESIZE_APP "$PKG" || true
            capture force_resize_landscape

            # Force user-controlled orientation and test portrait phone layout.
            adb shell am compat enable OVERRIDE_ANY_ORIENTATION_TO_USER "$PKG" || true
            adb shell settings put system user_rotation 0
            capture resize_user_portrait

            # Also remove portrait minimum-aspect restriction so Android can use the full phone surface.
            adb shell am compat enable OVERRIDE_MIN_ASPECT_RATIO "$PKG" || true
            adb shell am compat enable OVERRIDE_MIN_ASPECT_RATIO_EXCLUDE_PORTRAIT_FULLSCREEN "$PKG" || true
            capture resize_portrait_fullscreen

            cat diagnostics/results.txt

      - name: Upload compatibility screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-apk-mobile-compat-api36
          retention-days: 7
          if-no-files-found: error
          path: diagnostics/**
