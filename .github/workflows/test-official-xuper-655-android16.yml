name: Test official Xuper 6.5.5 Android 16 10-30-45

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-official-xuper-655-android16.yml'

permissions:
  contents: read

jobs:
  test-official-655:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Download official update APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          URL='https://gaeg.xvmobdes.com/download'
          UA='Mozilla/5.0 (Linux; Android 16; Pixel 6) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 -A "$UA" "$URL" -o /tmp/xuper.bin
          if ! unzip -t /tmp/xuper.bin >/dev/null 2>&1; then
            python3 - <<'PY'
          import html,re
          raw=open('/tmp/xuper.bin','rb').read(2500000).decode('utf-8','ignore')
          raw=html.unescape(raw).replace('\\/','/')
          urls=[]
          for pat in [r'https?://[^\"\'<>\s]+?\.apk(?:\?[^\"\'<>\s]*)?',r'https?://[^\"\'<>\s]+?/download[^\"\'<>\s]*']:
              urls += re.findall(pat,raw,re.I)
          urls=[u for u in urls if u!='https://gaeg.xvmobdes.com/download']
          if not urls: raise SystemExit('No APK/download URL found')
          open('/tmp/discovered-url.txt','w').write(urls[0])
          PY
            U="$(cat /tmp/discovered-url.txt)"
            echo "DISCOVERED_HOST=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.urlsplit(sys.argv[1]).netloc)' "$U")" | tee out/source.txt
            curl -fL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 -A "$UA" -e "$URL" "$U" -o /tmp/xuper.bin
          else
            echo 'DIRECT_APK=1' | tee out/source.txt
          fi
          unzip -t /tmp/xuper.bin >/dev/null
          cp /tmp/xuper.bin out/Xuper-6.5.5-official.apk
          sha256sum out/Xuper-6.5.5-official.apk | tee out/sha256.txt

      - name: Validate package version and signature
        shell: bash
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging out/Xuper-6.5.5-official.apk | tee out/badging.txt
          grep -q "package: name='com.msandroid.mobile'" out/badging.txt
          grep -q "versionCode='60505'" out/badging.txt
          grep -q "versionName='6.5.5'" out/badging.txt
          "$APKSIGNER" verify --verbose --print-certs out/Xuper-6.5.5-official.apk | tee out/signing.txt
          grep -q 'Verifies' out/signing.txt

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 install and 10-30-45 liveness
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -eu
            adb install -r out/Xuper-6.5.5-official.apk > out/install.txt 2>&1 || { cat out/install.txt; exit 11; }
            cat out/install.txt
            adb logcat -c
            adb shell am force-stop com.msandroid.mobile
            adb shell monkey -p com.msandroid.mobile -c android.intent.category.LAUNCHER 1 > out/launch.txt 2>&1 || true
            sleep 10
            P10=$(adb shell pidof com.msandroid.mobile | tr -d '\r' || true)
            echo "PID_10=$P10" | tee out/pid10.txt
            [ -n "$P10" ] || { adb logcat -d > out/logcat.txt; exit 12; }
            sleep 20
            P30=$(adb shell pidof com.msandroid.mobile | tr -d '\r' || true)
            echo "PID_30=$P30" | tee out/pid30.txt
            [ -n "$P30" ] || { adb logcat -d > out/logcat.txt; exit 13; }
            sleep 15
            P45=$(adb shell pidof com.msandroid.mobile | tr -d '\r' || true)
            echo "PID_45=$P45" | tee out/pid45.txt
            adb shell dumpsys activity activities > out/activity.txt || true
            adb logcat -d > out/logcat.txt || true
            [ -n "$P45" ] || exit 14
            ! grep -E 'FATAL EXCEPTION|SIGSEGV|UnsatisfiedLinkError' out/logcat.txt | grep 'com.msandroid.mobile' || exit 15
            echo 'LIVENESS_10_30_45=PASS' | tee out/result.txt

      - name: Upload official APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuper-655-official-android16-10-30-45
          path: out/**
          retention-days: 7
