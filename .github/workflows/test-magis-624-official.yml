name: Test official Magis 6.2.4 directly

on:
  push:
    branches: [ magis-mobile-recovery ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  smoke-624:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3

      - name: Download previously tested official successor
        uses: actions/download-artifact@v4
        with:
          name: xuper-mobile-official-successor-tested
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32975484926
          path: input

      - name: Validate 6.2.4 artifact
        shell: bash
        run: |
          set -euxo pipefail
          APK=input/Xuper-Mobile-Official-Successor-Tested.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.msandroid.mobile' versionCode='60204' versionName='6.2.4'" badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signing.txt
          sha256sum "$APK" | tee sha256.txt

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Direct Android 16 smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -eux
            mkdir -p diagnostics-624
            APK=input/Xuper-Mobile-Official-Successor-Tested.apk
            PKG=com.msandroid.mobile
            adb uninstall "$PKG" >/dev/null 2>&1 || true
            adb logcat -c || true
            adb install -r "$APK" | tee diagnostics-624/install.txt
            RESOLVED=$(adb shell cmd package resolve-activity --brief "$PKG" | tail -1 | tr -d '\r')
            echo "resolved=$RESOLVED" | tee diagnostics-624/resolved.txt
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1 || true
            sleep 15
            P15=$(adb shell pidof "$PKG" | tr -d '\r' || true)
            adb shell uiautomator dump /sdcard/ui15.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui15.xml diagnostics-624/ui15.xml >/dev/null 2>&1 || true
            adb exec-out screencap -p > diagnostics-624/screen15.png || true
            sleep 45
            P60=$(adb shell pidof "$PKG" | tr -d '\r' || true)
            adb shell uiautomator dump /sdcard/ui60.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui60.xml diagnostics-624/ui60.xml >/dev/null 2>&1 || true
            adb exec-out screencap -p > diagnostics-624/screen60.png || true
            adb logcat -d -v threadtime > diagnostics-624/logcat.txt || true
            echo "pid15=${P15:-DEAD} pid60=${P60:-DEAD}" | tee diagnostics-624/result.txt
            test -n "$P15"
            test -n "$P60"
            if grep -Eqi 'update|upgrade|new version|version.*(old|forbidden)|discontinued' diagnostics-624/ui15.xml diagnostics-624/ui60.xml; then
              echo UPDATE_TEXT_PRESENT | tee -a diagnostics-624/result.txt
            else
              echo NO_UPDATE_TEXT_DETECTED | tee -a diagnostics-624/result.txt
            fi

      - name: Upload direct-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magis-624-direct-android16
          retention-days: 7
          path: |
            diagnostics-624/**
            badging.txt
            signing.txt
            sha256.txt
