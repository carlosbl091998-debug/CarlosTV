name: Test Magis manifest-only version candidate on Android 16

on:
  push:
    branches: [ magis-frida-spawn-v2 ]
    paths:
      - '.github/workflows/test-magis-manifest-version.yml'
      - 'tools/build_test_magis_manifest_version.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  manifest-version-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Recover exact official Magis 6.2.4
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ARTIFACT_ID=9590851522
          EXPECTED_SHA=04bda60a0ebb003d1442483401978f39b601d989004d7b5e9c1f213a127d8835
          mkdir -p /tmp/magis624
          curl -fL --retry 4 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/magis624.zip
          unzip -q /tmp/magis624.zip -d /tmp/magis624
          cp /tmp/magis624/Xuper-Mobile-Official-Successor-Tested.apk Magis-6.2.4.apk
          echo "${EXPECTED_SHA}  Magis-6.2.4.apk" | sha256sum -c -
      - name: Install Apktool 3.0.3
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/apktool-bin"
          curl -fL --retry 4 --retry-all-errors \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
            -o "$RUNNER_TEMP/apktool-bin/apktool.jar"
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  '"$RUNNER_TEMP"'/apktool-bin/apktool.jar' | sha256sum -c -
          cat > "$RUNNER_TEMP/apktool-bin/apktool" <<'EOF'
          #!/usr/bin/env bash
          exec java -jar "$(dirname "$0")/apktool.jar" "$@"
          EOF
          chmod +x "$RUNNER_TEMP/apktool-bin/apktool"
          echo "$RUNNER_TEMP/apktool-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/apktool-bin/apktool" --version
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build and validate manifest-only candidate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/build_test_magis_manifest_version.sh
      - name: Print validation result
        if: always()
        run: |
          cat diagnostics-manifest-version/result.txt 2>/dev/null || true
          cat diagnostics-manifest-version/badging.txt 2>/dev/null | head -5 || true
          tail -100 diagnostics-manifest-version/apktool-build.txt 2>/dev/null || true
      - name: Upload candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magis-624-manifest-version900000-candidate
          retention-days: 7
          if-no-files-found: warn
          path: diagnostics-manifest-version/**
