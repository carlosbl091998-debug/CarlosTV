name: Test Xuper VOD version identity on Android 16

on:
  push:
    branches: [ magis-frida-spawn-v2 ]
    paths:
      - '.github/workflows/test-xuper-vod-version-identity.yml'
      - 'tools/build_test_xuper_vod_version_identity.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  vod-version-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Recover exact official Magis 6.2.4
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ARTIFACT_ID=9590851522
          EXPECTED_SHA=04bda60a0ebb003d1442483401978f39b601d989004d7b5e9c1f213a127d8835
          mkdir -p /tmp/magis624
          curl -fL --retry 4 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/magis624.zip
          unzip -q /tmp/magis624.zip -d /tmp/magis624
          cp /tmp/magis624/Xuper-Mobile-Official-Successor-Tested.apk Magis-6.2.4.apk
          echo "${EXPECTED_SHA}  Magis-6.2.4.apk" | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build and validate VOD version-identity candidate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/build_test_xuper_vod_version_identity.sh
      - name: Print validation result
        if: always()
        run: |
          cat diagnostics-vod-version-identity/result.txt 2>/dev/null || true
          cat diagnostics-vod-version-identity/badging.txt 2>/dev/null | head -5 || true
          cat diagnostics-vod-version-identity/binary-manifest-patch.txt 2>/dev/null || true
      - name: Upload candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuper-vod-version-identity-candidate
          retention-days: 7
          if-no-files-found: warn
          path: diagnostics-vod-version-identity/**
