name: Dump Magis 6.2.4 runtime DEX (spawn-first)

on:
  workflow_dispatch:
  push:
    branches: [magis-frida-spawn-v2]
    paths:
      - 'tools/dump_magis_runtime_spawn.sh'
      - '.github/workflows/dump-magis-runtime-spawn.yml'

jobs:
  dump-magis-624-spawn:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Recover exact official Magis 6.2.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ARTIFACT_ID=9590851522
          EXPECTED_SHA=04bda60a0ebb003d1442483401978f39b601d989004d7b5e9c1f213a127d8835
          mkdir -p diagnostics624 /tmp/magis624
          curl -fL --retry 4 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/magis624.zip
          unzip -q /tmp/magis624.zip -d /tmp/magis624
          cp /tmp/magis624/Xuper-Mobile-Official-Successor-Tested.apk Magis-6.2.4.apk
          echo "${EXPECTED_SHA}  Magis-6.2.4.apk" | sha256sum -c -

      - name: Install Frida tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'frida==17.2.17' 'frida-tools==14.4.5' frida-dexdump

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Spawn Xuper under Frida and dump decrypted DEX
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/dump_magis_runtime_spawn.sh

      - name: Upload runtime spawn dump and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magis-624-runtime-dexdump-spawn
          path: diagnostics624/**
          retention-days: 7
