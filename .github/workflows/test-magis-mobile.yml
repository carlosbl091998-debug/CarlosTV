name: Test official Magis 6.2.4 in Mexico GPS

on:
  push:
    branches: [ magis-mobile-recovery ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  mexico-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3

      - name: Download previously tested official 6.2.4
        uses: actions/download-artifact@v4
        with:
          name: xuper-mobile-official-successor-tested
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32975484926
          path: input

      - name: Validate APK identity
        shell: bash
        run: |
          set -euxo pipefail
          APK=input/Xuper-Mobile-Official-Successor-Tested.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.msandroid.mobile' versionCode='60204' versionName='6.2.4'" badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signing.txt
          sha256sum "$APK" | tee sha256.txt

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 Pixel 6 Mexico smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -eux
            mkdir -p diagnostics-mx
            APK=input/Xuper-Mobile-Official-Successor-Tested.apk
            PKG=com.msandroid.mobile
            adb uninstall "$PKG" >/dev/null 2>&1 || true
            adb logcat -c || true
            adb install -r "$APK" | tee diagnostics-mx/install.txt
            adb emu geo fix -99.1332 19.4326 || true
            adb shell appops set "$PKG" android:mock_location allow 2>/dev/null || true
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1 || true
            sleep 15
            P15=$(adb shell pidof "$PKG" | tr -d '\r' || true)
            adb shell uiautomator dump /sdcard/ui15.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui15.xml diagnostics-mx/ui15.xml >/dev/null 2>&1 || true
            adb exec-out screencap -p > diagnostics-mx/screen15.png || true
            sleep 45
            P60=$(adb shell pidof "$PKG" | tr -d '\r' || true)
            adb shell uiautomator dump /sdcard/ui60.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui60.xml diagnostics-mx/ui60.xml >/dev/null 2>&1 || true
            adb exec-out screencap -p > diagnostics-mx/screen60.png || true
            adb logcat -d -v threadtime > diagnostics-mx/logcat.txt || true
            echo "pid15=${P15:-DEAD} pid60=${P60:-DEAD}" | tee diagnostics-mx/result.txt
            grep -Eio 'Due to copyright restrictions[^<]*|update[^<]*|upgrade[^<]*|new version[^<]*|discontinued[^<]*' diagnostics-mx/ui15.xml diagnostics-mx/ui60.xml | tee diagnostics-mx/dialog-text.txt || true
            test -n "$P15"
            test -n "$P60"

      - name: Upload Mexico diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magis-624-mexico-android16
          retention-days: 7
          path: |
            diagnostics-mx/**
            badging.txt
            signing.txt
            sha256.txt
