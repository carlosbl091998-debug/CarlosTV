name: Test Magis variants one by one

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/test-magis-variants-individual.yml'
      - 'tools/test_magis_624_variants_individually.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  variants:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Recover official Magis 6.2.4
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ARTIFACT_ID=9590851522
          EXPECTED_SHA=04bda60a0ebb003d1442483401978f39b601d989004d7b5e9c1f213a127d8835
          mkdir -p /tmp/magis624
          curl -fL --retry 4 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/magis624.zip
          unzip -q /tmp/magis624.zip -d /tmp/magis624
          cp /tmp/magis624/Xuper-Mobile-Official-Successor-Tested.apk Magis-6.2.4.apk
          echo "${EXPECTED_SHA}  Magis-6.2.4.apk" | sha256sum -c -

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test endpoint flags combo independently
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/test_magis_624_variants_individually.sh

      - name: Print individual results
        if: always()
        shell: bash
        run: |
          cat diagnostics-variants/summary.txt 2>/dev/null || true
          for mode in endpoint flags combo; do
            echo "===== $mode crash summary ====="
            cat "diagnostics-variants/$mode/crash-summary.txt" 2>/dev/null || true
          done

      - name: Upload results and APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magis-624-variants-one-by-one
          retention-days: 7
          if-no-files-found: warn
          path: diagnostics-variants/**
