name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK requerido
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Limpiar proyecto
        run: gradle --no-daemon clean

      - name: Compilar APK de prueba
        run: gradle --no-daemon assembleDebug

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CarlosTV-v1.0.0-portal-debug.apk

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: CarlosTV-v1.0.0-portal-debug
          path: CarlosTV-v1.0.0-portal-debug.apk
          if-no-files-found: error
          retention-days: 30
