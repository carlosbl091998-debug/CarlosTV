name: Test Magis 6.2.4 no-update gate on Android 16

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test-magis-624:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Recover exact tested official Magis 6.2.4 from historical artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ARTIFACT_ID=9590851522
          EXPECTED_SHA=04bda60a0ebb003d1442483401978f39b601d989004d7b5e9c1f213a127d8835
          mkdir -p /tmp/magis624
          curl -fL --retry 4 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/magis624.zip
          unzip -q /tmp/magis624.zip -d /tmp/magis624
          test -s /tmp/magis624/Xuper-Mobile-Official-Successor-Tested.apk
          cp /tmp/magis624/Xuper-Mobile-Official-Successor-Tested.apk Magis-6.2.4.apk
          echo "${EXPECTED_SHA}  Magis-6.2.4.apk" | sha256sum -c -
          unzip -t Magis-6.2.4.apk >/dev/null
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging Magis-6.2.4.apk | tee recovered-badging.txt
          grep -q "package: name='com.msandroid.mobile' versionCode='60204' versionName='6.2.4'" recovered-badging.txt
          "$APKSIGNER" verify --verbose --print-certs Magis-6.2.4.apk | tee recovered-signing.txt
          grep -qi 'd30dc60fd8625d49fa4e82eb442c9307743f9621004b94e229dcc01f6a9035ff' recovered-signing.txt

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Test three Magis 6.2.4 update-gate patches on Pixel 6 Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/test_magis_624_permission_wrapper.sh

      - name: Summarize result
        if: always()
        shell: bash
        run: |
          echo '=== RESULT ==='
          cat diagnostics-update/result.txt 2>/dev/null || true
          cat diagnostics-update/baseline-result.txt 2>/dev/null || true
          cat diagnostics-update/winner.txt 2>/dev/null || true
          cat diagnostics-update/standalone-result.txt 2>/dev/null || true
          find diagnostics-update -maxdepth 2 -type f -name '*TESTED*' -o -name '*result.txt' | sort || true

      - name: Upload Magis 6.2.4 test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magis-624-no-update-android16
          retention-days: 7
          if-no-files-found: warn
          path: |
            recovered-badging.txt
            recovered-signing.txt
            diagnostics-update/**
