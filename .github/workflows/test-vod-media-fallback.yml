name: Test Xuper VOD media fallback on Android 16

on:
  workflow_dispatch:
  push:
    branches: [xuper-vod-media-fallback]
    paths:
      - 'tools/build_vod_media_fallback.sh'
      - 'tools/build_vod_v9_gadget.sh'
      - '.github/workflows/test-vod-media-fallback.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Build runtime media fallback candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/build_vod_media_fallback.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Write Android 16 validation script
        run: |
          cat > /tmp/validate-vod-media.sh <<'BASH'
          #!/usr/bin/env bash
          set -euxo pipefail
          OUT='diagnostics-vod-media-fallback'
          APK="$OUT/Xuper-6.2.4-VOD-MediaFallback-Test.apk"
          PKG='com.msandroid.mobile'
          adb uninstall "$PKG" >/dev/null 2>&1 || true
          adb install -g "$APK" | tee "$OUT/install.txt"
          adb logcat -c
          adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 > "$OUT/launch.txt" 2>&1 || true
          sleep 20
          PID20=$(adb shell pidof "$PKG" | tr -d '\r' || true)
          adb exec-out screencap -p > "$OUT/screen-20.png" || true
          sleep 40
          PID60=$(adb shell pidof "$PKG" | tr -d '\r' || true)
          adb exec-out screencap -p > "$OUT/screen-60.png" || true
          adb logcat -d -v threadtime > "$OUT/logcat.txt" || true
          echo "pid20=$PID20 pid60=$PID60" | tee "$OUT/runtime-result.txt"
          test -n "$PID20"
          test -n "$PID60"
          if grep -Eqi 'FATAL EXCEPTION|UnsatisfiedLinkError|SIGABRT|Fatal signal' "$OUT/logcat.txt"; then
            grep -Ein 'FATAL EXCEPTION|UnsatisfiedLinkError|SIGABRT|Fatal signal' "$OUT/logcat.txt" | tail -80
            exit 70
          fi
          grep -Ei 'XUPER_VOD_MEDIA|frida|gadget' "$OUT/logcat.txt" | tail -250 > "$OUT/gadget-log.txt" || true
          echo 'ANDROID16_STABILITY_OK' | tee -a "$OUT/runtime-result.txt"
          BASH
          chmod +x /tmp/validate-vod-media.sh

      - name: Validate install and 60s stability on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash /tmp/validate-vod-media.sh

      - name: Upload candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuper-vod-media-fallback-candidate
          path: diagnostics-vod-media-fallback/**
          retention-days: 7
