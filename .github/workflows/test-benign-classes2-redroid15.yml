name: Test benign classes2 on ARM64 Redroid15

on:
  push:
    branches: [xuper-vod-media-fallback]
    paths: ['.github/workflows/test-benign-classes2-redroid15.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STABLE_ARTIFACT: '9623417943'
    steps:
      - uses: actions/checkout@v4
      - name: Build and sign benign multidex candidate on x86_64
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip zip openjdk-17-jdk-headless >/dev/null
          mkdir -p work/stable src build out
          curl -fL --retry 4 --retry-all-errors -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STABLE_ARTIFACT}/zip" -o work/stable.zip
          unzip -q work/stable.zip -d work/stable
          STABLE=$(find work/stable -type f -name '*.apk' | head -1)
          test -s "$STABLE"
          SDKROOT=/tmp/android-sdk
          mkdir -p "$SDKROOT"
          curl -fL --retry 4 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmd.zip
          unzip -q /tmp/cmd.zip -d /tmp/cmd
          mkdir -p "$SDKROOT/cmdline-tools/latest" && mv /tmp/cmd/cmdline-tools/* "$SDKROOT/cmdline-tools/latest/"
          yes | "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDKROOT" --licenses >/dev/null || true
          "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDKROOT" 'build-tools;35.0.0' >/dev/null
          cat > src/Benign.java <<'EOF'
          package com.carlostv.probe;
          public final class Benign { public static int value(){ return 1; } }
          EOF
          javac -source 8 -target 8 -d build src/Benign.java
          "$SDKROOT/build-tools/35.0.0/d8" --output build build/com/carlostv/probe/Benign.class
          mv build/classes.dex classes2.dex
          cp "$STABLE" candidate-unsigned.apk
          zip -q -d candidate-unsigned.apk 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/*.SF' 'META-INF/MANIFEST.MF' >/dev/null 2>&1 || true
          zip -q -u candidate-unsigned.apk classes2.dex
          keytool -genkeypair -noprompt -keystore work/probe.jks -storepass android -keypass android -alias probe -dname 'CN=BenignDexProbe,O=LocalTest,C=MX' -keyalg RSA -keysize 2048 -validity 10000 >/dev/null
          "$SDKROOT/build-tools/35.0.0/zipalign" -f -p 4 candidate-unsigned.apk aligned.apk
          "$SDKROOT/build-tools/35.0.0/apksigner" sign --ks work/probe.jks --ks-key-alias probe --ks-pass pass:android --key-pass pass:android --out out/candidate.apk aligned.apk
          "$SDKROOT/build-tools/35.0.0/apksigner" verify --verbose out/candidate.apk > out/signature.txt
          sha256sum out/candidate.apk > out/candidate-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benign-candidate
          path: out/**
          retention-days: 7

  arm64-liveness:
    needs: build-candidate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      PACKAGE: com.msandroid.mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: benign-candidate
          path: candidate
      - name: Start Redroid15 native ARM64
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-tools-adb kmod gcc linux-libc-dev >/dev/null
          mkdir -p runtime
          KREL="$(uname -r)"
          sudo apt-get install -y -qq "linux-modules-extra-${KREL}" >/dev/null 2>&1 || true
          sudo depmod -a || true
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          sudo mkdir -p /dev/binderfs
          if ! mountpoint -q /dev/binderfs; then sudo mount -t binder binder /dev/binderfs; fi
          cat >/tmp/mkbinder.c <<'EOF'
          #include <errno.h>
          #include <fcntl.h>
          #include <stdio.h>
          #include <sys/ioctl.h>
          #include <unistd.h>
          #include <linux/android/binderfs.h>
          static int add(int fd,const char*n){struct binderfs_device d={0};snprintf(d.name,sizeof(d.name),"%s",n);if(ioctl(fd,BINDER_CTL_ADD,&d)==0||errno==EEXIST)return 0;return 1;}
          int main(void){int fd=open("/dev/binderfs/binder-control",O_RDONLY|O_CLOEXEC);if(fd<0)return 2;int r=add(fd,"binder")|add(fd,"hwbinder")|add(fd,"vndbinder");close(fd);return r;}
          EOF
          gcc -O2 /tmp/mkbinder.c -o /tmp/mkbinder
          sudo /tmp/mkbinder || true
          for n in binder hwbinder vndbinder; do test -e "/dev/binderfs/$n"; sudo chmod 666 "/dev/binderfs/$n" || true; done
          docker pull redroid/redroid:15.0.0_64only-latest >/dev/null
          docker run -d --privileged --name redroid15 -p 5555:5555 -v /dev/binderfs:/dev/binderfs redroid/redroid:15.0.0_64only-latest androidboot.redroid_gpu_mode=guest >/dev/null
          adb start-server
          for i in $(seq 1 120); do adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true; B=$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r'); [ "$B" = 1 ] && break; [ "$i" = 120 ] && exit 72; sleep 2; done
          adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi | tee runtime/abi.txt
          adb -s 127.0.0.1:5555 shell getprop ro.build.version.sdk | tee runtime/sdk.txt
          grep -q '^arm64-v8a' runtime/abi.txt
          grep -q '^35' runtime/sdk.txt
      - name: Install launch and enforce 10 30 45 second liveness
        shell: bash
        run: |
          set -u
          APK=candidate/candidate.apk
          test -s "$APK" || exit 79
          adb -s 127.0.0.1:5555 uninstall "$PACKAGE" >/dev/null 2>&1 || true
          adb -s 127.0.0.1:5555 install -g "$APK" | tee runtime/install.txt
          grep -q Success runtime/install.txt || exit 80
          adb -s 127.0.0.1:5555 logcat -c
          adb -s 127.0.0.1:5555 shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER --pct-syskeys 0 --pct-appswitch 0 --pct-anyevent 0 1 > runtime/launch.txt 2>&1 || true
          sleep 3
          PID=$(adb -s 127.0.0.1:5555 shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r[:space:]' || true)
          echo "$PID" > runtime/pid-initial.txt
          PASS=1; [ -n "$PID" ] || PASS=0; START=$(date +%s)
          for T in 10 30 45; do while [ $(( $(date +%s)-START )) -lt "$T" ]; do sleep 1; done; P=$(adb -s 127.0.0.1:5555 shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r[:space:]' || true); echo "$T $P" | tee -a runtime/pid-samples.txt; [ -n "$P" ] && [ "$P" = "$PID" ] || PASS=0; done
          adb -s 127.0.0.1:5555 logcat -d -v threadtime > runtime/logcat.txt 2>&1 || true
          adb -s 127.0.0.1:5555 logcat -b crash -d -v threadtime > runtime/crash.txt 2>&1 || true
          if grep -E "com\.msandroid\.mobile|sandroid\.mobile" runtime/logcat.txt runtime/crash.txt | grep -Eqi 'FATAL EXCEPTION|Fatal signal|SIGSEGV|UnsatisfiedLinkError|Process .* died|Force finishing activity'; then PASS=0; fi
          echo "FINAL_PASS=$PASS" | tee runtime/result.txt
          [ "$PASS" = 1 ]
      - name: Upload ARM64 diagnostics and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benign-classes2-redroid15
          path: |
            candidate/candidate.apk
            candidate/candidate-sha256.txt
            candidate/signature.txt
            runtime/**
          retention-days: 7
