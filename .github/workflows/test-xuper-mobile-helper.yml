name: Test Xuper mobile helper

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helper-runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Configure Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build mobile helper APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon :mobilehelper:assembleDebug
          cp mobilehelper/build/outputs/apk/debug/mobilehelper-debug.apk Xuper-Mobile-Helper.apk
          test -s Xuper-Mobile-Helper.apk

      - name: Download exact Xuper 4.34.5 content
        shell: bash
        run: |
          set -euxo pipefail
          PAGE='https://www.mediafire.com/file/azgvigddkzvrss4/Xuper_4.34.5_%28com.android.mgstv%29.apk/file'
          curl -fL --retry 3 -A 'Mozilla/5.0' "$PAGE" -o mf.html
          python3 - <<'PY' > direct.txt
          import html,re
          t=html.unescape(open('mf.html',encoding='utf-8',errors='ignore').read()).replace('\\/','/')
          for p in [r'id=[\"\']downloadButton[\"\'][^>]*href=[\"\']([^\"\']+)',r'href=[\"\']([^\"\']+)[\"\'][^>]*id=[\"\']downloadButton[\"\']']:
              m=re.search(p,t,re.I)
              if m:
                  print(m.group(1)); break
          PY
          test -s direct.txt
          curl -fL --retry 3 -A 'Mozilla/5.0' "$(cat direct.txt)" -o base.apk
          unzip -t base.apk >/dev/null
          python3 - <<'PY'
          import hashlib,sys,zipfile
          expected='165d2aeefe3bcc4b79c839708d82d41fd8e0dc6259acd3116cf8a3a00ea8c25f'
          with zipfile.ZipFile('base.apk') as z:
              names=sorted(n for n in z.namelist() if not n.upper().startswith('META-INF/'))
              h=hashlib.sha256()
              for n in names:
                  d=z.read(n); h.update(n.encode()+b'\0'+hashlib.sha256(d).digest())
              got=h.hexdigest()
          print('logical_sha256=',got)
          if got != expected: sys.exit('APK content mismatch')
          print('CONTENT_MATCH_OK')
          PY

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install and exercise helper with original Xuper
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/test_xuper_mobile_helper.sh

      - name: Publish tested helper APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuper-mobile-helper-tested
          retention-days: 30
          if-no-files-found: warn
          path: |
            Xuper-Mobile-Helper.apk
            helper-diagnostics/**
