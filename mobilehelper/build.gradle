plugins {
    id 'com.android.application'
}

android {
    namespace 'com.carlostv.mobilehelper'
    compileSdk 36

    defaultConfig {
        // V2 intentionally uses a brand-new package id so Android/OEM package
        // installers cannot confuse it with any earlier helper build signed by
        // a different CI debug certificate.
        applicationId 'com.carlostv.xupermobile.v2'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
