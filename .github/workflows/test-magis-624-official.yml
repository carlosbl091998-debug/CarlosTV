name: Test Xuper 6.5.5 direct signed candidate

on:
  push:
    branches: [ magis-mobile-recovery ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xuper-655-direct:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Download bootstrap and direct 6.5.5 candidate
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-all-errors -A 'Mozilla/5.0' 'https://tinyurl.com/Magis-TV-File' -o magis-current.apk
          curl -fL --retry 5 --retry-all-errors -A 'Mozilla/5.0' 'https://magistvgratis.live/magis_Tv_app_2026.apk' -o xuper-655-candidate.apk
          unzip -t magis-current.apk >/dev/null
          unzip -t xuper-655-candidate.apk >/dev/null

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)

          "$AAPT" dump badging magis-current.apk | tee bootstrap-badging.txt
          "$AAPT" dump badging xuper-655-candidate.apk | tee candidate-badging.txt
          grep -q "package: name='com.msandroid.mobile'" candidate-badging.txt
          grep -q "versionCode='60505'" candidate-badging.txt
          grep -q "versionName='6.5.5'" candidate-badging.txt

          "$APKSIGNER" verify --verbose --print-certs magis-current.apk | tee bootstrap-signing.txt
          "$APKSIGNER" verify --verbose --print-certs xuper-655-candidate.apk | tee candidate-signing.txt
          BOOT_CERT=$(sed -n 's/.*certificate SHA-256 digest: //p' bootstrap-signing.txt | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          CAND_CERT=$(sed -n 's/.*certificate SHA-256 digest: //p' candidate-signing.txt | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          echo "bootstrap_cert=$BOOT_CERT" | tee signer-match.txt
          echo "candidate_cert=$CAND_CERT" | tee -a signer-match.txt
          test -n "$BOOT_CERT"
          test "$BOOT_CERT" = "$CAND_CERT"
          sha256sum magis-current.apk xuper-655-candidate.apk | tee candidate-sha256.txt

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install and validate 6.5.5 on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/test_xuper_655_direct.sh

      - name: Preserve only verified final APK
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          APK=diagnostics-655-direct/Xuper-6.5.5-Final-Tested.apk
          test -s "$APK"
          cp "$APK" Xuper-6.5.5-OFICIAL-ANDROID16-SIN-ACTUALIZACION.apk
          sha256sum Xuper-6.5.5-OFICIAL-ANDROID16-SIN-ACTUALIZACION.apk | tee Xuper-6.5.5-OFICIAL-ANDROID16-SIN-ACTUALIZACION.sha256

      - name: Upload APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuper-655-direct-android16-no-update
          retention-days: 7
          if-no-files-found: warn
          path: |
            Xuper-6.5.5-OFICIAL-ANDROID16-SIN-ACTUALIZACION.apk
            Xuper-6.5.5-OFICIAL-ANDROID16-SIN-ACTUALIZACION.sha256
            bootstrap-badging.txt
            candidate-badging.txt
            bootstrap-signing.txt
            candidate-signing.txt
            signer-match.txt
            candidate-sha256.txt
            diagnostics-655-direct/**
