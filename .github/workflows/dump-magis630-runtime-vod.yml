name: Dump Magis 6.3 runtime VOD logic
on:
  workflow_dispatch:
  push:
    branches: [magis-vod-runtime-dex-stable]
    paths: ['.github/workflows/dump-magis630-runtime-vod.yml']
jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PKG: com.msandroid.mobile
      DONOR_SHA256: d4edfc8ee9fbc008f9daa2cbb3aac733939987b7570bfc58a7065ebecfaa510a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Recover exact 6.3 donor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics630
          HOST='magisapktv.com'; URL='https://magisapktv.com/files/magis-celular-magisapktv.com.apk'
          accept(){ f="$1"; [ -s "$f" ] || return 1; sha=$(sha256sum "$f"|awk '{print $1}'); bytes=$(stat -c '%s' "$f"); echo "candidate bytes=$bytes sha=$sha"; [ "$sha" = "$DONOR_SHA256" ] && [ "$bytes" = '35766216' ] && unzip -t "$f" >/dev/null && mv "$f" Magis-6.3.apk; }
          curl -fL --connect-timeout 8 --max-time 100 --retry 2 --retry-all-errors -A 'Mozilla/5.0' "$URL" -o /tmp/donor.apk || true
          accept /tmp/donor.apk || rm -f /tmp/donor.apk
          if [ ! -f Magis-6.3.apk ]; then
            curl -fsSL -H 'Accept: application/dns-json' 'https://dns.google/resolve?name=magisapktv.com&type=A' -o /tmp/doh.json
            IP=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/doh.json'))
          print(next((a['data'] for a in d.get('Answer',[]) if a.get('type')==1),''))
          PY
            )
            test -n "$IP"
            curl -fL --resolve "$HOST:443:$IP" --connect-timeout 10 --max-time 120 --retry 2 --retry-all-errors -A 'Mozilla/5.0' "$URL" -o /tmp/donor.apk
            accept /tmp/donor.apk
          fi
          test -f Magis-6.3.apk
          sha256sum Magis-6.3.apk | tee diagnostics630/apk-sha.txt
          unzip -l Magis-6.3.apk | grep -E 'lib/(x86_64|x86|arm64-v8a)/.*\.so' > diagnostics630/native-list.txt || true
      - name: Install Frida tools
        run: |
          python -m pip install --user 'frida==17.2.17' 'frida-tools==14.4.5' frida-dexdump >/dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write proven runtime dump script
        run: |
          cat > diagnostics630/run.sh <<'BASH'
          #!/usr/bin/env bash
          set -euxo pipefail
          rm -rf diagnostics630/dexdump-early diagnostics630/dexdump-late diagnostics630/dexdump diagnostics630/jadx-runtime
          mkdir -p diagnostics630/dexdump-early diagnostics630/dexdump-late diagnostics630/dexdump diagnostics630/jadx-runtime
          adb root || true
          adb wait-for-device
          adb install -r Magis-6.3.apk | tee diagnostics630/install.txt
          adb shell pm clear "$PKG" || true
          FRIDA_VERSION=17.2.17
          curl -fL --retry 3 --retry-all-errors https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-server-${FRIDA_VERSION}-android-x86_64.xz -o /tmp/frida-server.xz
          xz -dc /tmp/frida-server.xz > /tmp/frida-server; chmod +x /tmp/frida-server
          adb push /tmp/frida-server /data/local/tmp/frida-server >/dev/null
          adb shell chmod 755 /data/local/tmp/frida-server
          adb shell 'pkill -9 frida-server || true; nohup /data/local/tmp/frida-server >/data/local/tmp/frida.log 2>&1 &' || true
          sleep 3
          frida-ps -Uai | tee diagnostics630/frida-ps-before-launch.txt
          adb shell am force-stop "$PKG" || true
          adb logcat -c || true
          timeout 20s adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 > diagnostics630/launch-monkey.txt 2>&1 || true
          PID=''
          for i in $(seq 1 30); do PID=$(adb shell pidof "$PKG" 2>/dev/null | tr -d '\r[:space:]' || true); [ -n "$PID" ] && break; sleep 1; done
          if [ -z "$PID" ]; then echo APP_PID_NOT_FOUND | tee diagnostics630/result.txt; adb logcat -d -v threadtime > diagnostics630/logcat-launch-fail.txt || true; exit 3; fi
          echo "$PID" | tee diagnostics630/app-pid.txt
          frida-ps -Uai | tee diagnostics630/frida-ps-after-launch.txt
          sleep 2
          set +e
          timeout 90s frida-dexdump -U -p "$PID" -o diagnostics630/dexdump-early 2>&1 | tee diagnostics630/frida-dexdump-early.txt
          EARLY_RC=${PIPESTATUS[0]}
          set -e
          echo "early_rc=$EARLY_RC" > diagnostics630/frida-dexdump-early-rc.txt
          sleep 10
          PID2=$(adb shell pidof "$PKG" 2>/dev/null | tr -d '\r[:space:]' || true)
          if [ -n "$PID2" ]; then
            set +e
            timeout 90s frida-dexdump -U -p "$PID2" -o diagnostics630/dexdump-late 2>&1 | tee diagnostics630/frida-dexdump-late.txt
            LATE_RC=${PIPESTATUS[0]}
            set -e
          else LATE_RC=99; fi
          echo "late_rc=$LATE_RC" > diagnostics630/frida-dexdump-late-rc.txt
          python3 - <<'PY'
          import glob,hashlib,os
          out='diagnostics630/dexdump';os.makedirs(out,exist_ok=True);seen=set();n=0
          for p in sorted(glob.glob('diagnostics630/dexdump-*/*.dex')):
              b=open(p,'rb').read();h=hashlib.sha256(b).hexdigest()
              if h in seen: continue
              seen.add(h);n+=1;open(f'{out}/runtime-{n:03d}-{h[:12]}.dex','wb').write(b)
          print(n,file=open('diagnostics630/dex-count.txt','w'))
          PY
          find diagnostics630/dexdump -type f -name '*.dex' -print -exec sha256sum '{}' ';' | tee diagnostics630/dex-files.txt
          curl -fL --retry 3 --retry-all-errors https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          rm -rf /tmp/jadx-bin; unzip -q /tmp/jadx.zip -d /tmp/jadx-bin
          mapfile -t DEXES < <(find diagnostics630/dexdump -type f -name '*.dex' | sort)
          if [ ${#DEXES[@]} -gt 0 ]; then /tmp/jadx-bin/bin/jadx --no-res --show-bad-code -d diagnostics630/jadx-runtime "${DEXES[@]}" > diagnostics630/jadx.log 2>&1 || true; fi
          grep -RIna -E 'StartPlayVODBean|startPlayVOD|StartPlayVODResult|PlayAty|totalMovieList|episodeList|vod_no_media|TitanPlayerController|getMedias\(|getMedia\(' diagnostics630/jadx-runtime/sources > diagnostics630/vod-hits.txt || true
          python3 - <<'PY'
          import os,re
          hits='diagnostics630/vod-hits.txt';out='diagnostics630/vod-context.txt';seen=[]
          if os.path.exists(hits):
            for line in open(hits,errors='ignore'):
              m=re.match(r'([^:]+):(\d+):',line)
              if m:
                k=(m.group(1),int(m.group(2)))
                if k not in seen: seen.append(k)
          with open(out,'w') as w:
            for p,n in seen[:250]:
              try: lines=open(p,errors='ignore').read().splitlines()
              except: continue
              w.write(f'\n===== {p}:{n} =====\n')
              for i in range(max(1,n-55),min(len(lines),n+55)+1): w.write(f'{i:05d}: {lines[i-1]}\n')
          PY
          adb shell pidof "$PKG" > diagnostics630/pid-final.txt || true
          adb logcat -d -v threadtime > diagnostics630/logcat.txt || true
          echo "PID=$PID EARLY_RC=$EARLY_RC LATE_RC=$LATE_RC DEX_COUNT=$(cat diagnostics630/dex-count.txt) FINAL_PID=$(cat diagnostics630/pid-final.txt 2>/dev/null || true)" | tee diagnostics630/result.txt
          test "$(cat diagnostics630/dex-count.txt)" -gt 0
          BASH
          chmod +x diagnostics630/run.sh; bash -n diagnostics630/run.sh
      - name: Android 16 dump 6.3 runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash diagnostics630/run.sh
      - name: Upload 6.3 VOD runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magis630-vod-runtime
          path: diagnostics630/**
          retention-days: 7
