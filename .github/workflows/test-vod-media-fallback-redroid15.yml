name: Validate static Xuper VOD fallback on native ARM64 Redroid15

on:
  workflow_dispatch:
  push:
    branches: [xuper-vod-media-fallback]
    paths:
      - 'tools/build_vod_media_fallback.sh'
      - '.github/workflows/test-vod-media-fallback-redroid15.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      PACKAGE: com.msandroid.mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build static VOD fallback without Frida
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zipalign apksigner curl unzip zip >/dev/null
          bash tools/build_vod_media_fallback.sh
          CANDIDATE='diagnostics-vod-media-fallback/Xuper-6.2.4-VOD-StaticFallback-NoFrida.apk'
          test -s "$CANDIDATE"
          cp "$CANDIDATE" candidate.apk
          sha256sum candidate.apk | tee candidate-sha256.txt
          unzip -l candidate.apk > package-files.txt
          if grep -Eqi 'libgadget|VodFixProvider' package-files.txt; then
            echo 'FORBIDDEN_FRIDA_COMPONENT_FOUND' >&2
            exit 41
          fi

      - name: Start native ARM64 Android 15 Redroid
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-tools-adb kmod gcc linux-libc-dev >/dev/null
          mkdir -p runtime
          KREL="$(uname -r)"
          sudo apt-get install -y -qq "linux-modules-extra-${KREL}" >/dev/null 2>&1 || true
          sudo depmod -a || true
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          sudo mkdir -p /dev/binderfs
          if ! mountpoint -q /dev/binderfs; then sudo mount -t binder binder /dev/binderfs; fi
          cat >/tmp/mkbinder.c <<'EOF'
          #include <errno.h>
          #include <fcntl.h>
          #include <stdio.h>
          #include <sys/ioctl.h>
          #include <unistd.h>
          #include <linux/android/binderfs.h>
          static int add(int fd,const char*n){struct binderfs_device d={0};snprintf(d.name,sizeof(d.name),"%s",n);if(ioctl(fd,BINDER_CTL_ADD,&d)==0||errno==EEXIST)return 0;return 1;}
          int main(void){int fd=open("/dev/binderfs/binder-control",O_RDONLY|O_CLOEXEC);if(fd<0)return 2;int r=add(fd,"binder")|add(fd,"hwbinder")|add(fd,"vndbinder");close(fd);return r;}
          EOF
          gcc -O2 /tmp/mkbinder.c -o /tmp/mkbinder
          sudo /tmp/mkbinder || true
          for n in binder hwbinder vndbinder; do test -e "/dev/binderfs/$n"; sudo chmod 666 "/dev/binderfs/$n" || true; done
          docker pull redroid/redroid:15.0.0_64only-latest >/dev/null
          docker run -d --privileged --name redroid15 -p 5555:5555 -v /dev/binderfs:/dev/binderfs redroid/redroid:15.0.0_64only-latest androidboot.redroid_gpu_mode=guest >/dev/null
          adb start-server
          for i in $(seq 1 120); do
            adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            B=$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$B" = 1 ] && break
            [ "$i" = 120 ] && exit 72
            sleep 2
          done
          adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi | tee runtime/abi.txt
          adb -s 127.0.0.1:5555 shell getprop ro.build.version.sdk | tee runtime/sdk.txt
          grep -q '^arm64-v8a' runtime/abi.txt
          grep -q '^35' runtime/sdk.txt

      - name: Enforce install and 10 30 45 second liveness
        shell: bash
        run: |
          set -euo pipefail
          adb -s 127.0.0.1:5555 uninstall "$PACKAGE" >/dev/null 2>&1 || true
          adb -s 127.0.0.1:5555 install --no-incremental -g candidate.apk | tee runtime/install.txt
          grep -q 'Success' runtime/install.txt
          adb -s 127.0.0.1:5555 logcat -c
          adb -s 127.0.0.1:5555 shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER --pct-syskeys 0 --pct-appswitch 0 --pct-anyevent 0 1 > runtime/launch.txt 2>&1 || true
          sleep 3
          INITIAL_PID=$(adb -s 127.0.0.1:5555 shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r[:space:]')
          test -n "$INITIAL_PID"
          echo "$INITIAL_PID" | tee runtime/pid-initial.txt
          START=$(date +%s)
          for target in 10 30 45; do
            while [ $(( $(date +%s) - START )) -lt "$target" ]; do sleep 1; done
            PID=$(adb -s 127.0.0.1:5555 shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r[:space:]')
            printf '%s %s\n' "$target" "$PID" | tee -a runtime/pid-samples.txt
            test -n "$PID"
            test "$PID" = "$INITIAL_PID"
          done
          adb -s 127.0.0.1:5555 logcat -d -v threadtime > runtime/logcat.txt 2>&1 || true
          adb -s 127.0.0.1:5555 logcat -b crash -d -v threadtime > runtime/crash.txt 2>&1 || true
          if grep -E "com\.msandroid\.mobile|sandroid\.mobile" runtime/logcat.txt runtime/crash.txt | grep -Eqi 'FATAL EXCEPTION|Fatal signal|SIGSEGV|UnsatisfiedLinkError|Process .* died|Force finishing activity'; then
            echo 'FATAL_RUNTIME_SIGNATURE_FOUND' | tee runtime/result.txt
            exit 74
          fi
          echo 'NATIVE_ARM64_REDROID15_LIVENESS_10_30_45_OK' | tee runtime/result.txt

      - name: Capture diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          adb -s 127.0.0.1:5555 exec-out screencap -p > runtime/final-screen.png 2>/dev/null || true
          adb -s 127.0.0.1:5555 logcat -d -v threadtime > runtime/logcat-final.txt 2>/dev/null || true
          adb -s 127.0.0.1:5555 logcat -b crash -d -v threadtime > runtime/crash-final.txt 2>/dev/null || true
          adb -s 127.0.0.1:5555 shell dumpsys activity activities > runtime/activities.txt 2>/dev/null || true
          adb -s 127.0.0.1:5555 shell pidof "$PACKAGE" > runtime/pid-final.txt 2>/dev/null || true

      - name: Upload candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuper-vod-static-fallback-redroid15-arm64
          path: |
            candidate.apk
            candidate-sha256.txt
            diagnostics-vod-media-fallback/**
            runtime/**
          retention-days: 7
