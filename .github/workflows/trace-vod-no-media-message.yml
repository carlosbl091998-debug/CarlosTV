name: Trace Xuper VOD no-media message

on:
  push:
    branches: [ magis-frida-spawn-v2 ]
    paths:
      - 'tools/trace_vod_no_media_message.sh'
      - '.github/workflows/trace-vod-no-media-message.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact official Magis 6.2.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ARTIFACT_ID=9590851522
          EXPECTED_SHA=04bda60a0ebb003d1442483401978f39b601d989004d7b5e9c1f213a127d8835
          mkdir -p /tmp/magis624
          curl -fL --retry 4 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/magis624.zip
          unzip -q /tmp/magis624.zip -d /tmp/magis624
          cp /tmp/magis624/Xuper-Mobile-Official-Successor-Tested.apk Magis-6.2.4.apk
          echo "${EXPECTED_SHA}  Magis-6.2.4.apk" | sha256sum -c -
      - name: Trace visible VOD error to control flow
        run: bash tools/trace_vod_no_media_message.sh
      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuper-vod-no-media-message-trace
          retention-days: 7
          if-no-files-found: warn
          path: diagnostics-vod-message-trace/**
