name: Test TV APK on phone emulator

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone-launch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Download same Xuper 4.34.5 package mirror
        shell: bash
        run: |
          set -euxo pipefail
          PAGE='https://www.mediafire.com/file/azgvigddkzvrss4/Xuper_4.34.5_%28com.android.mgstv%29.apk/file'
          curl -fL --retry 3 -A 'Mozilla/5.0' "$PAGE" -o mf.html
          python3 - <<'PY' > direct.txt
          import html,re
          t=html.unescape(open('mf.html',encoding='utf-8',errors='ignore').read()).replace('\\/','/')
          pats=[r'id=[\"\']downloadButton[\"\'][^>]*href=[\"\']([^\"\']+)',r'href=[\"\']([^\"\']+)[\"\'][^>]*id=[\"\']downloadButton[\"\']']
          for p in pats:
              m=re.search(p,t,re.I)
              if m:
                  print(m.group(1)); break
          PY
          test -s direct.txt
          curl -fL --retry 3 -A 'Mozilla/5.0' "$(cat direct.txt)" -o base.apk
          unzip -t base.apk >/dev/null
          sha256sum base.apk | tee mirror-file-sha.txt

      - name: Verify mirror matches user base contents
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' | tee mirror-content.txt
          import hashlib,sys,zipfile
          expected_logical='165d2aeefe3bcc4b79c839708d82d41fd8e0dc6259acd3116cf8a3a00ea8c25f'
          expected={
            'AndroidManifest.xml':'d20a21acc604b1b055a5c5130d5dbf36219d4923a634b4a85650cf549aa2afe8',
            'classes.dex':'73de3ce36e5983dbc13be7b42d49a8ef0e8ecc42693f9d9912d3eda4f535f9cc',
            'resources.arsc':'37f6dc0f28ecab6df6a1f9473e9881db62832fc822782a567246541b442d84b2',
            'assets/ijm_lib/arm64-v8a/libexec.so':'512180fa7a5981837bf101474ea76168965dfa2bc367f141f750ac6e17fb7bae',
            'assets/ijm_lib/arm64-v8a/libexecmain.so':'a0864c7be8520aca7e76377cb87542c446fd1704214e6626ee715afedd2a1ee1',
          }
          with zipfile.ZipFile('base.apk') as z:
              names=sorted(n for n in z.namelist() if not n.upper().startswith('META-INF/'))
              h=hashlib.sha256()
              for n in names:
                  d=z.read(n)
                  h.update(n.encode()+b'\0'+hashlib.sha256(d).digest())
              logical=h.hexdigest()
              print('entries_total=',len(z.namelist()))
              print('entries_nonmeta=',len(names))
              print('logical_sha256=',logical)
              ok=(logical==expected_logical)
              for n,want in expected.items():
                  got=hashlib.sha256(z.read(n)).hexdigest()
                  print(n,got,'MATCH' if got==want else 'MISMATCH')
                  ok &= got==want
              if not ok:
                  print('Mirror does not match the user-supplied base APK contents.', file=sys.stderr)
                  sys.exit(42)
          print('CONTENT_MATCH_OK')
          PY

      - name: Install Android build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'build-tools;36.0.0'
          echo "BT=$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_ENV"

      - name: Create isolated test signing key
        shell: bash
        run: |
          keytool -genkeypair -v -keystore mobile-test.jks -storepass android -keypass android -alias mobiletest -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Mobile Adaptation Test,O=Local Test,C=MX'

      - name: Build no-op re-signed control
        shell: bash
        run: |
          set -euxo pipefail
          cp base.apk noop-unsigned.apk
          zip -d noop-unsigned.apk 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/*.SF' 'META-INF/MANIFEST.MF' || true
          "$BT/zipalign" -f -p 4 noop-unsigned.apk noop-aligned.apk
          "$BT/apksigner" sign --ks mobile-test.jks --ks-pass pass:android --key-pass pass:android --out noop-resigned.apk noop-aligned.apk
          "$BT/apksigner" verify --verbose noop-resigned.apk

      - name: Build minimal mobile-orientation candidate
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/patch_tv_manifest.py base.apk sensor-unsigned.apk --orientation 4
          "$BT/zipalign" -f -p 4 sensor-unsigned.apk sensor-aligned.apk
          "$BT/apksigner" sign --ks mobile-test.jks --ks-pass pass:android --key-pass pass:android --out Xuper_Movil_sensor_test.apk sensor-aligned.apk
          "$BT/apksigner" verify --verbose Xuper_Movil_sensor_test.apk

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Emulator launch tests on phone profile with ARM translation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            cp Xuper_Movil_sensor_test.apk sensor-mobile.apk
            bash tools/run_apk_launch_tests.sh

      - name: Upload diagnostics and candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk-diagnostics-api35
          if-no-files-found: ignore
          retention-days: 7
          path: |
            mirror-file-sha.txt
            mirror-content.txt
            diagnostics/**
            noop-resigned.apk
            Xuper_Movil_sensor_test.apk
