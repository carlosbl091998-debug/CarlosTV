name: Validate DownloadFileProvider-patched Xuper on ARM64

on:
  workflow_dispatch:
  push:
    branches: [xuper-vod-media-fallback]
    paths:
      - 'tools/build_vod_media_fallback.sh'
      - 'tools/patch_download_file_provider.sh'
      - 'tools/patch_app_not_final.sh'
      - 'tools/repair_recovered_dex_headers.sh'
      - '.github/workflows/test-vod-download-provider-redroid-arm64.yml'

jobs:
  arm64-liveness:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      PACKAGE: com.msandroid.mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare tools and build candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y -qq adb apksigner zipalign unzip zip curl kmod gcc linux-libc-dev >/dev/null
          sed -i 's#\.super Landroid/app/Application;#.super Lcom/mobile/brasiltv/app/App;#' tools/build_vod_media_fallback.sh
          sed -i 's#Landroid/app/Application;-><init>()V#Lcom/mobile/brasiltv/app/App;-><init>()V#' tools/build_vod_media_fallback.sh
          bash tools/build_vod_media_fallback.sh
          bash tools/repair_recovered_dex_headers.sh diagnostics-vod-media-fallback/Xuper-6.2.4-VOD-StaticFallback-NoFrida.apk
          bash tools/patch_download_file_provider.sh diagnostics-vod-media-fallback/Xuper-6.2.4-VOD-StaticFallback-NoFrida.apk
          bash tools/patch_app_not_final.sh diagnostics-vod-media-fallback/Xuper-6.2.4-VOD-StaticFallback-NoFrida.apk
          cp diagnostics-vod-media-fallback/Xuper-6.2.4-VOD-StaticFallback-NoFrida.apk candidate.apk
          sha256sum candidate.apk | tee candidate-sha256.txt
          apksigner verify --verbose candidate.apk
      - name: Start native ARM64 Android 15
        run: |
          set -euo pipefail
          mkdir -p runtime/redroid-data
          KREL=$(uname -r)
          sudo apt-get install -y -qq "linux-modules-extra-${KREL}" >/dev/null 2>&1 || true
          sudo depmod -a || true
          sudo modprobe binder_linux devices='binder,hwbinder,vndbinder' || true
          sudo mkdir -p /dev/binderfs
          mountpoint -q /dev/binderfs || sudo mount -t binder binder /dev/binderfs
          cat >/tmp/mkbinder.c <<'EOF'
          #include <errno.h>
          #include <fcntl.h>
          #include <stdio.h>
          #include <sys/ioctl.h>
          #include <unistd.h>
          #include <linux/android/binderfs.h>
          static int add(int fd,const char*n){struct binderfs_device d={0};snprintf(d.name,sizeof(d.name),"%s",n);if(ioctl(fd,BINDER_CTL_ADD,&d)==0||errno==EEXIST)return 0;return 1;}
          int main(void){int fd=open("/dev/binderfs/binder-control",O_RDONLY|O_CLOEXEC);if(fd<0)return 2;int r=add(fd,"binder")|add(fd,"hwbinder")|add(fd,"vndbinder");close(fd);return r;}
          EOF
          gcc -O2 /tmp/mkbinder.c -o /tmp/mkbinder
          sudo /tmp/mkbinder || true
          for n in binder hwbinder vndbinder; do sudo chmod 666 /dev/binderfs/$n || true; done
          docker pull redroid/redroid:15.0.0_64only-latest >/dev/null
          docker run -d --name redroid --privileged -v "$PWD/runtime/redroid-data:/data" -v /dev/binderfs:/dev/binderfs -p 5555:5555 redroid/redroid:15.0.0_64only-latest androidboot.redroid_gpu_mode=guest >/dev/null
          adb start-server
          for i in $(seq 1 120); do
            adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            BOOT=$(timeout 3s adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            [ "$BOOT" = 1 ] && break
            sleep 2
          done
          timeout 5s adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi | tr -d '\r' | tee runtime/abi.txt
          timeout 5s adb -s 127.0.0.1:5555 shell getprop ro.build.version.sdk | tr -d '\r' | tee runtime/sdk.txt
          grep -q '^arm64-v8a$' runtime/abi.txt
          grep -q '^35$' runtime/sdk.txt
      - name: Enforce 10 30 45 second liveness
        run: |
          set -euo pipefail
          DEV=127.0.0.1:5555
          adb -s "$DEV" uninstall "$PACKAGE" >/dev/null 2>&1 || true
          adb -s "$DEV" install -r -g candidate.apk | tee runtime/install.txt
          grep -q Success runtime/install.txt
          adb -s "$DEV" logcat -c
          RESOLVED=$(adb -s "$DEV" shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER "$PACKAGE" | tail -1 | tr -d '\r[:space:]')
          test -n "$RESOLVED"; [[ "$RESOLVED" == */* ]]
          adb -s "$DEV" shell am start -W -n "$RESOLVED" | tee runtime/launch.txt
          sleep 3
          INITIAL_PID=$(adb -s "$DEV" shell pidof "$PACKAGE" | tr -d '\r[:space:]' || true)
          test -n "$INITIAL_PID"
          echo "$INITIAL_PID" | tee runtime/pid-initial.txt
          START=$(date +%s)
          for target in 10 30 45; do
            while [ $(( $(date +%s) - START )) -lt "$target" ]; do sleep 1; done
            PID=$(adb -s "$DEV" shell pidof "$PACKAGE" | tr -d '\r[:space:]' || true)
            printf '%s %s\n' "$target" "$PID" | tee -a runtime/pid-samples.txt
            test -n "$PID"; test "$PID" = "$INITIAL_PID"
          done
          adb -s "$DEV" logcat -d -v threadtime > runtime/logcat.txt || true
          adb -s "$DEV" logcat -b crash -d -v threadtime > runtime/crash.txt || true
          if grep -Eqi "$PACKAGE.*(FATAL EXCEPTION|UnsatisfiedLinkError|Fatal signal|SIGSEGV|SIGABRT)|(FATAL EXCEPTION|UnsatisfiedLinkError|Fatal signal|SIGSEGV|SIGABRT).*$PACKAGE" runtime/logcat.txt runtime/crash.txt; then exit 74; fi
          echo 'NATIVE_ARM64_ANDROID15_LIVENESS_10_30_45_OK' | tee runtime/result.txt
      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p runtime
          adb -s 127.0.0.1:5555 logcat -d -v threadtime > runtime/logcat-final.txt 2>/dev/null || true
          adb -s 127.0.0.1:5555 logcat -b crash -d -v threadtime > runtime/crash-final.txt 2>/dev/null || true
          adb -s 127.0.0.1:5555 shell pidof "$PACKAGE" > runtime/pid-final.txt 2>/dev/null || true
          echo '=== PID FINAL ==='
          cat runtime/pid-final.txt || true
          echo '=== CRASH BUFFER ==='
          cat runtime/crash-final.txt || true
          echo '=== RELEVANT LOGCAT ==='
          grep -Ei -C 8 'FATAL EXCEPTION|AndroidRuntime|UnsatisfiedLinkError|ClassNotFoundException|NoClassDefFoundError|VerifyError|DexFile|SIGSEGV|SIGABRT|Fatal signal|com\.msandroid\.mobile|DownloadFileProvider' runtime/logcat-final.txt | tail -n 600 || true
          sudo rm -rf runtime/redroid-data || true
      - name: Upload candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuper-vod-download-provider-arm64
          path: |
            candidate.apk
            candidate-sha256.txt
            diagnostics-vod-media-fallback/**
            runtime/**
          retention-days: 7
