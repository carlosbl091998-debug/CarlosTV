name: Validate VOD candidate on Redroid Android 16 ARM64

on:
  workflow_dispatch:
  push:
    branches: [xuper-vod-media-fallback]
    paths:
      - '.github/workflows/test-redroid-arm64-android16.yml'

jobs:
  redroid-arm64-liveness:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      PACKAGE: com.msandroid.mobile
      SOURCE_ARTIFACT_ID: '9701400558'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare host, adb and candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-tools-adb curl unzip kmod gcc linux-libc-dev >/dev/null
          uname -a | tee host-uname.txt
          docker version | tee docker-version.txt
          curl -fL --retry 4 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o source.zip
          mkdir source && unzip -q source.zip -d source
          cp source/candidate.apk candidate.apk
          sha256sum candidate.apk | tee candidate-sha256.txt
      - name: Create Binder devices and start Android 16 ARM64 container
        run: |
          set -euo pipefail
          KREL="$(uname -r)"
          apt-cache policy "linux-modules-extra-${KREL}" | tee binder-package-policy.txt || true
          sudo apt-get install -y -qq "linux-modules-extra-${KREL}" >> binder-package-policy.txt 2>&1 || true
          sudo depmod -a || true
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 | tee modprobe-binder.txt || true
          sudo mkdir -p /dev/binderfs
          if ! mountpoint -q /dev/binderfs; then sudo mount -t binder binder /dev/binderfs; fi
          cat > /tmp/mkbinder.c <<'EOF'
          #include <errno.h>
          #include <fcntl.h>
          #include <stdio.h>
          #include <string.h>
          #include <sys/ioctl.h>
          #include <unistd.h>
          #include <linux/android/binderfs.h>
          static int add(int fd, const char *name) {
            struct binderfs_device d = {0};
            snprintf(d.name, sizeof(d.name), "%s", name);
            if (ioctl(fd, BINDER_CTL_ADD, &d) == 0 || errno == EEXIST) return 0;
            perror(name); return 1;
          }
          int main(void) {
            int fd = open("/dev/binderfs/binder-control", O_RDONLY | O_CLOEXEC);
            if (fd < 0) { perror("binder-control"); return 2; }
            int rc = add(fd,"binder") | add(fd,"hwbinder") | add(fd,"vndbinder");
            close(fd); return rc;
          }
          EOF
          gcc -O2 -Wall /tmp/mkbinder.c -o /tmp/mkbinder
          sudo /tmp/mkbinder || true
          for n in binder hwbinder vndbinder; do
            if [ -e "/dev/binderfs/$n" ]; then
              sudo ln -sf "/dev/binderfs/$n" "/dev/$n"
              sudo chmod 666 "/dev/binderfs/$n" || true
            fi
          done
          ls -la /dev/binderfs /dev/binder /dev/hwbinder /dev/vndbinder 2>&1 | tee binder-devices.txt || true
          { cat /proc/filesystems; cat /proc/modules; } | grep -E 'binder|ashmem' | tee binder-host.txt || true
          test -e /dev/binderfs/binder
          test -e /dev/binderfs/hwbinder
          test -e /dev/binderfs/vndbinder
          docker pull redroid/redroid:16.0.0_64only-latest
          docker image inspect redroid/redroid:16.0.0_64only-latest --format '{{.Architecture}} {{.Os}}' | tee image-platform.txt
          grep -qx 'arm64 linux' image-platform.txt
          docker rm -f redroid16 >/dev/null 2>&1 || true
          docker run -d --privileged \
            --name redroid16 \
            -p 5555:5555 \
            -v /dev/binderfs:/dev/binderfs \
            redroid/redroid:16.0.0_64only-latest \
            androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_width=1080 \
            androidboot.redroid_height=2400 \
            androidboot.redroid_dpi=420 | tee container-id.txt
          sleep 8
          docker ps -a --filter name=redroid16 --no-trunc | tee redroid-ps.txt
          docker inspect redroid16 > redroid-inspect.json || true
      - name: Wait for Android 16 and verify ARM64
        run: |
          set -euo pipefail
          mkdir -p bootdiag
          START=$(date +%s)
          READY=0
          adb start-server
          for i in $(seq 1 120); do
            adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            if adb -s 127.0.0.1:5555 get-state 2>/dev/null | grep -qx device; then
              BOOT=$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ $((i % 10)) -eq 0 ]; then
                adb -s 127.0.0.1:5555 shell getprop > "bootdiag/getprop-$i.txt" 2>/dev/null || true
                adb -s 127.0.0.1:5555 shell ps -A > "bootdiag/ps-$i.txt" 2>/dev/null || true
                adb -s 127.0.0.1:5555 logcat -d -v threadtime > "bootdiag/logcat-$i.txt" 2>/dev/null || true
                adb -s 127.0.0.1:5555 shell dmesg > "bootdiag/dmesg-$i.txt" 2>/dev/null || true
              fi
              if [ "$BOOT" = 1 ]; then READY=1; echo "BOOT_SECONDS=$(( $(date +%s)-START ))" | tee boot-time.txt; break; fi
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx redroid16; then exit 70; fi
            sleep 2
          done
          if [ "$READY" != 1 ]; then
            adb -s 127.0.0.1:5555 logcat -d -v threadtime > bootdiag/logcat-final.txt 2>/dev/null || true
            adb -s 127.0.0.1:5555 shell getprop > bootdiag/getprop-final.txt 2>/dev/null || true
            exit 72
          fi
          adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi | tee device-abi.txt
          grep -qx arm64-v8a device-abi.txt
          adb -s 127.0.0.1:5555 shell getprop ro.build.version.sdk | tee device-sdk.txt
          grep -qx 36 device-sdk.txt
          adb -s 127.0.0.1:5555 shell getprop ro.build.version.release | tee device-release.txt
      - name: Install and enforce 10 30 45 second liveness
        run: |
          set -euo pipefail
          mkdir -p runtime
          adb -s 127.0.0.1:5555 install -r -g candidate.apk | tee runtime/install.txt
          grep -q Success runtime/install.txt
          adb -s 127.0.0.1:5555 logcat -c
          adb -s 127.0.0.1:5555 shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1 > runtime/launch.txt 2>&1
          sleep 3
          PID=$(adb -s 127.0.0.1:5555 shell pidof "$PACKAGE" | tr -d '\r[:space:]')
          test -n "$PID"
          echo "$PID" > runtime/pid-initial.txt
          START=$(date +%s)
          for T in 10 30 45; do
            while [ $(( $(date +%s)-START )) -lt "$T" ]; do sleep 1; done
            P=$(adb -s 127.0.0.1:5555 shell pidof "$PACKAGE" | tr -d '\r[:space:]')
            echo "$T $P" | tee -a runtime/pid-samples.txt
            test "$P" = "$PID"
          done
          adb -s 127.0.0.1:5555 logcat -d -v threadtime > runtime/logcat.txt
          adb -s 127.0.0.1:5555 logcat -b crash -d -v threadtime > runtime/crash.txt || true
          ! grep -Eqi 'FATAL EXCEPTION|UnsatisfiedLinkError|SIGABRT|Fatal signal|SIGSEGV' runtime/logcat.txt runtime/crash.txt
          echo ANDROID16_ARM64_LIVENESS_10_30_45_OK | tee runtime/result.txt
      - name: Capture final diagnostics
        if: always()
        run: |
          docker ps -a --filter name=redroid16 --no-trunc > redroid-ps.txt 2>&1 || true
          docker inspect redroid16 > redroid-inspect.json 2>/dev/null || true
          adb -s 127.0.0.1:5555 shell getprop > device-getprop.txt 2>/dev/null || true
          adb -s 127.0.0.1:5555 logcat -d -v threadtime > redroid-adb-logcat.txt 2>/dev/null || true
      - name: Upload tested APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuper-vod-static-fallback-redroid16-arm64
          path: |
            candidate.apk
            candidate-sha256.txt
            host-uname.txt
            docker-version.txt
            binder-package-policy.txt
            modprobe-binder.txt
            binder-devices.txt
            binder-host.txt
            image-platform.txt
            container-id.txt
            redroid-ps.txt
            redroid-inspect.json
            boot-time.txt
            device-abi.txt
            device-sdk.txt
            device-release.txt
            device-getprop.txt
            redroid-adb-logcat.txt
            bootdiag/**
            runtime/**
          retention-days: 7
