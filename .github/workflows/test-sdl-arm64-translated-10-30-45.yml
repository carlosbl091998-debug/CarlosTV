name: Compare stable vs SDL ARM64 10-30-45s

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-sdl-arm64-translated-10-30-45.yml'

jobs:
  arm64-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;35.0.0' >/dev/null
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Download exact stable base and SDL candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/base /tmp/sdl
          curl -fL --retry 4 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/carlosbl091998-debug/CarlosTV/actions/artifacts/9623417943/zip' -o /tmp/base.zip
          unzip -q /tmp/base.zip -d /tmp/base
          BASE=''
          while IFS= read -r f; do
            if [ "$(sha256sum "$f" | awk '{print $1}')" = '8ba6eb4a13bdec2d8d8ab06a1502194f488ce58d9fb6de7feeb1c539ef0f7b4e' ]; then BASE="$f"; break; fi
          done < <(find /tmp/base -type f -name '*.apk')
          test -n "$BASE"
          cp "$BASE" stable.apk
          curl -fL --retry 4 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/carlosbl091998-debug/CarlosTV/actions/artifacts/9633216673/zip' -o /tmp/sdl.zip
          unzip -q /tmp/sdl.zip -d /tmp/sdl
          cp /tmp/sdl/candidate-sdl.apk sdl.apk
          echo "STABLE=$(sha256sum stable.apk | awk '{print $1}')"
          echo "SDL=$(sha256sum sdl.apk | awk '{print $1}')"
      - name: Build ARM64-only controls and sign
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          for src,name in [('stable.apk','stable'),('sdl.apk','sdl')]:
              out=f'{name}-arm64-unsigned.apk'
              with zipfile.ZipFile(src) as z, zipfile.ZipFile(out,'w',allowZip64=True) as o:
                  for it in z.infolist():
                      p=it.filename
                      if p.startswith('META-INF/'):
                          continue
                      if p.startswith('lib/') and not p.startswith('lib/arm64-v8a/'):
                          continue
                      d=z.read(p)
                      n=zipfile.ZipInfo(p,it.date_time)
                      n.compress_type=it.compress_type
                      n.comment=it.comment; n.extra=it.extra
                      n.internal_attr=it.internal_attr; n.external_attr=it.external_attr
                      n.create_system=it.create_system
                      o.writestr(n,d)
          PY
          keytool -genkeypair -keystore /tmp/test.keystore -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US' >/dev/null 2>&1
          for name in stable sdl; do
            zipalign -P 16 -f 4 "$name-arm64-unsigned.apk" "$name-arm64-aligned.apk"
            apksigner sign --ks /tmp/test.keystore --ks-pass pass:android --key-pass pass:android \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --out "$name-arm64.apk" "$name-arm64-aligned.apk"
            apksigner verify --verbose "$name-arm64.apk"
          done
      - name: Create single-shell runtime test
        shell: bash
        run: |
          cat > test-runtime.sh <<'BASH'
          #!/usr/bin/env bash
          set -u
          mkdir -p diagnostics
          adb shell getprop ro.product.cpu.abilist > diagnostics/abilist.txt
          adb shell getprop ro.dalvik.vm.native.bridge > diagnostics/native-bridge.txt
          adb shell getprop ro.enable.native.bridge.exec > diagnostics/native-bridge-exec.txt

          run_case() {
            local name="$1"
            local apk="$2"
            local dir="diagnostics/$name"
            mkdir -p "$dir"
            adb uninstall com.msandroid.mobile >/dev/null 2>&1 || true
            adb install -g "$apk" > "$dir/install.txt" 2>&1 || true
            adb shell pm path com.msandroid.mobile > "$dir/pm-path.txt" 2>&1 || true
            if ! grep -q 'Success' "$dir/install.txt" || ! grep -q '^package:' "$dir/pm-path.txt"; then
              echo INSTALL_FAIL > "$dir/result.txt"
              adb logcat -d -v threadtime > "$dir/logcat.txt" 2>/dev/null || true
              return 0
            fi
            adb logcat -c
            adb shell monkey -p com.msandroid.mobile -c android.intent.category.LAUNCHER 1 > "$dir/monkey.txt" 2>&1 || true
            sleep 10
            adb shell pidof com.msandroid.mobile | tr -d '\r[:space:]' > "$dir/pid10.txt" || true
            adb shell dumpsys activity activities > "$dir/activity10.txt" 2>/dev/null || true
            sleep 20
            adb shell pidof com.msandroid.mobile | tr -d '\r[:space:]' > "$dir/pid30.txt" || true
            adb shell dumpsys activity activities > "$dir/activity30.txt" 2>/dev/null || true
            sleep 15
            adb shell pidof com.msandroid.mobile | tr -d '\r[:space:]' > "$dir/pid45.txt" || true
            adb shell dumpsys activity activities > "$dir/activity45.txt" 2>/dev/null || true
            adb logcat -d -v threadtime > "$dir/logcat.txt" 2>/dev/null || true
            adb logcat -b crash -d -v threadtime > "$dir/crash-buffer.txt" 2>/dev/null || true
            {
              echo "PID10=$(cat "$dir/pid10.txt" 2>/dev/null)"
              echo "PID30=$(cat "$dir/pid30.txt" 2>/dev/null)"
              echo "PID45=$(cat "$dir/pid45.txt" 2>/dev/null)"
            } > "$dir/pids.txt"
            if [ -s "$dir/pid10.txt" ] && [ -s "$dir/pid30.txt" ] && [ -s "$dir/pid45.txt" ]; then
              echo PASS_45 > "$dir/result.txt"
            else
              echo PROCESS_DIED > "$dir/result.txt"
            fi
            cat "$dir/pids.txt"
            cat "$dir/result.txt"
          }

          run_case stable stable-arm64.apk
          run_case sdl sdl-arm64.apk
          echo "STABLE_RESULT=$(cat diagnostics/stable/result.txt)"
          echo "SDL_RESULT=$(cat diagnostics/sdl/result.txt)"
          BASH
          chmod +x test-runtime.sh
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 ARM64 translated stable vs SDL 10-30-45
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash test-runtime.sh
      - name: Upload comparison diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-vs-sdl-arm64-api36-10-30-45
          path: |
            stable-arm64.apk
            sdl-arm64.apk
            diagnostics/**
          retention-days: 7
