name: Test Xuper VOD v9 external hook

on:
  workflow_dispatch:
  push:
    branches: [magis-frida-spawn-v2]
    paths:
      - 'tools/vod_v9_external_hook.js'
      - 'tools/run_external_vod_test.sh'
      - '.github/workflows/dump-magis-runtime-spawn.yml'

jobs:
  test-vod-v9-external:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: android-actions/setup-android@v3

      - name: Prepare stable APK and Frida tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p stable-base diagnostics-vod-v9-external
          curl -fL --retry 4 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9623417943/zip" \
            -o /tmp/stable.zip
          unzip -q /tmp/stable.zip -d /tmp/stable
          cp "$(find /tmp/stable -type f -name '*.apk' | head -1)" stable-base/Xuper-base-stable.apk
          sha256sum stable-base/Xuper-base-stable.apk | tee diagnostics-vod-v9-external/base-sha256.txt
          python -m pip install --disable-pip-version-check 'frida==17.2.17' 'frida-tools'
          curl -fL --retry 3 --retry-all-errors \
            'https://github.com/frida/frida/releases/download/17.2.17/frida-server-17.2.17-android-x86_64.xz' \
            -o /tmp/frida-server.xz
          xz -dc /tmp/frida-server.xz > /tmp/frida-server
          chmod +x /tmp/frida-server tools/run_external_vod_test.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Validate stable APK plus external VOD v9 hook on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/run_external_vod_test.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuper-vod-v9-external-test
          path: diagnostics-vod-v9-external/**
          retention-days: 7
