name: Validate static Xuper VOD fallback on native ARM64 Android 16

on:
  workflow_dispatch:
  push:
    branches: [xuper-vod-media-fallback]
    paths:
      - 'tools/build_vod_media_fallback.sh'
      - '.github/workflows/test-vod-media-fallback.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      PACKAGE: com.msandroid.mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Bootstrap Android command-line tools on ARM64
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="$HOME/android-sdk"
          AVDROOT="$RUNNER_TEMP/android-avd"
          mkdir -p "$SDKROOT/cmdline-tools" "$AVDROOT"
          curl -fL --retry 4 --retry-all-errors \
            'https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip' \
            -o /tmp/cmdline-tools.zip
          rm -rf /tmp/cmdline-tools-unpack
          mkdir -p /tmp/cmdline-tools-unpack
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-unpack
          rm -rf "$SDKROOT/cmdline-tools/latest"
          mv /tmp/cmdline-tools-unpack/cmdline-tools "$SDKROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$AVDROOT" >> "$GITHUB_ENV"
          echo "$SDKROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDKROOT/emulator" >> "$GITHUB_PATH"
          "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" --version | tee sdkmanager-version.txt
          yes | "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install native Linux ARM64 emulator and Android 16 image
        shell: bash
        run: |
          set -euo pipefail
          uname -a | tee host.txt
          uname -m | tee host-arch.txt
          test "$(uname -m)" = 'aarch64'
          sudo apt-get update -qq
          sudo apt-get install -y -qq adb libpulse0 libnss3 libx11-6 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxi6 libxtst6 libdrm2 libgbm1 libxkbcommon0 zipalign apksigner
          command -v adb | tee adb-path.txt
          file "$(command -v adb)" | tee adb-host-binary.txt
          adb version | tee adb-version.txt
          command -v zipalign | tee zipalign-path.txt
          command -v apksigner | tee apksigner-path.txt
          file "$(command -v zipalign)" | tee zipalign-host-binary.txt
          file "$(command -v apksigner)" | tee apksigner-host-binary.txt

          mkdir -p "$ANDROID_HOME/platform-tools"
          ln -sf "$(command -v adb)" "$ANDROID_HOME/platform-tools/adb"

          EMU_URL='https://github.com/Changqing-JING/android-emulator-aarch64-linux/releases/download/v2.12.0-19097-g85fa07f04ef/sdk-repo-linux_aarch64-emulator-standalone-0.zip'
          curl -fL --retry 4 --retry-all-errors "$EMU_URL" -o /tmp/emulator-arm64.zip
          echo '67ce4f576687b067d9b36668405b86b9749745d67d31037616aac12c49c63a65  /tmp/emulator-arm64.zip' | sha256sum -c -
          rm -rf "$ANDROID_HOME/emulator"
          unzip -q /tmp/emulator-arm64.zip -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/emulator/emulator"
          file "$ANDROID_HOME/emulator/emulator" | tee emulator-binary.txt
          file "$ANDROID_HOME/emulator/emulator" | grep -Eqi 'ARM aarch64|ARM64|aarch64'

          cat > "$ANDROID_HOME/emulator/package.xml" <<'XML'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <ns2:repository xmlns:ns2="http://schemas.android.com/repository/android/common/01" xmlns:ns3="http://schemas.android.com/repository/android/generic/01">
            <localPackage path="emulator" obsolete="false">
              <type-details xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:type="ns3:genericDetailsType"/>
              <revision><major>36</major><minor>2</minor><micro>12</micro></revision>
              <display-name>Android Emulator ARM64 Community Build</display-name>
            </localPackage>
          </ns2:repository>
          XML
          sdkmanager --list_installed | tee sdk-installed-before.txt
          sdkmanager --install 'system-images;android-36;google_apis;arm64-v8a' >/dev/null
          sdkmanager --list_installed | tee sdk-installed-after.txt
          "$ANDROID_HOME/emulator/emulator" -version 2>&1 | tee emulator-version.txt
          "$ANDROID_HOME/emulator/emulator" -accel-check 2>&1 | tee accel-check.txt || true
          ls -l /dev/kvm 2>&1 | tee kvm.txt || true
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi

      - name: Build static VOD fallback without Frida
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash tools/build_vod_media_fallback.sh
          CANDIDATE='diagnostics-vod-media-fallback/Xuper-6.2.4-VOD-StaticFallback-NoFrida.apk'
          test -s "$CANDIDATE"
          cp "$CANDIDATE" candidate.apk
          sha256sum candidate.apk | tee candidate-sha256.txt
          unzip -l candidate.apk > package-files.txt
          if grep -Eqi 'libgadget|VodFixProvider' package-files.txt; then
            echo 'FORBIDDEN_FRIDA_COMPONENT_FOUND' >&2
            exit 41
          fi

      - name: Create ARM64 AVD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n arm64_api36 -k 'system-images;android-36;google_apis;arm64-v8a' -d pixel_6 --force
          find "$ANDROID_AVD_HOME" -maxdepth 2 \( -type f -o -type d \) | sort | tee avd-files.txt
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee avd-list.txt
          grep -qx 'arm64_api36' avd-list.txt

      - name: Start native ARM64 emulator
        shell: bash
        run: |
          set -euo pipefail
          ACCEL_ARGS='-accel off'
          QEMU_ARGS='-qemu -machine gic-version=3'
          if [ -e /dev/kvm ]; then
            ACCEL_ARGS='-accel on'
            QEMU_ARGS=''
          fi
          nohup "$ANDROID_HOME/emulator/emulator" -avd arm64_api36 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect $ACCEL_ARGS $QEMU_ARGS > emulator.log 2>&1 &
          echo $! > emulator.pid
          for i in $(seq 1 300); do
            if timeout 5 adb devices | grep -q 'emulator-.*device'; then
              BOOT=$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$BOOT" = '1' ]; then break; fi
            fi
            if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then
              echo 'EMULATOR_EXITED_EARLY' >&2
              cat emulator.log >&2 || true
              exit 70
            fi
            sleep 2
          done
          test "$(timeout 5 adb shell getprop sys.boot_completed | tr -d '\r')" = '1'
          timeout 5 adb shell getprop ro.product.cpu.abi | tee device-abi.txt
          grep -q '^arm64-v8a$' device-abi.txt
          timeout 5 adb shell getprop ro.build.version.sdk | tee device-sdk.txt
          grep -q '^36$' device-sdk.txt

      - name: Enforce 10 30 45 second liveness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          timeout 10 adb uninstall "$PACKAGE" >/dev/null 2>&1 || true
          timeout 120 adb install -g candidate.apk | tee runtime/install.txt
          grep -q 'Success' runtime/install.txt
          timeout 10 adb logcat -c
          timeout 10 adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1 > runtime/launch.txt 2>&1
          sleep 3
          INITIAL_PID=$(timeout 5 adb shell pidof "$PACKAGE" | tr -d '\r[:space:]')
          test -n "$INITIAL_PID"
          echo "$INITIAL_PID" | tee runtime/pid-initial.txt
          START=$(date +%s)
          for target in 10 30 45; do
            while [ $(( $(date +%s) - START )) -lt "$target" ]; do sleep 1; done
            PID=$(timeout 5 adb shell pidof "$PACKAGE" | tr -d '\r[:space:]')
            printf '%s %s\n' "$target" "$PID" | tee -a runtime/pid-samples.txt
            test -n "$PID"
            test "$PID" = "$INITIAL_PID"
          done
          timeout 20 adb logcat -d -v threadtime > runtime/logcat.txt
          timeout 20 adb logcat -b crash -d -v threadtime > runtime/crash-buffer.txt || true
          if grep -Eqi 'FATAL EXCEPTION|UnsatisfiedLinkError|SIGABRT|Fatal signal|SIGSEGV' runtime/logcat.txt runtime/crash-buffer.txt; then
            echo 'FATAL_RUNTIME_SIGNATURE_FOUND' | tee runtime/result.txt
            exit 74
          fi
          echo 'ANDROID16_NATIVE_ARM64_LIVENESS_10_30_45_OK' | tee runtime/result.txt

      - name: Capture final diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p runtime
          timeout 10 adb exec-out screencap -p > runtime/final-screen.png 2>/dev/null || true
          timeout 10 adb logcat -d -v threadtime > runtime/logcat-final.txt 2>/dev/null || true
          timeout 10 adb logcat -b crash -d -v threadtime > runtime/crash-final.txt 2>/dev/null || true
          timeout 10 adb shell dumpsys activity activities > runtime/activities.txt 2>/dev/null || true
          timeout 10 adb shell pidof "$PACKAGE" > runtime/pid-final.txt 2>/dev/null || true

      - name: Upload candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuper-vod-static-fallback-native-arm64
          path: |
            candidate.apk
            candidate-sha256.txt
            sdkmanager-version.txt
            sdk-installed-before.txt
            sdk-installed-after.txt
            host.txt
            host-arch.txt
            adb-path.txt
            adb-host-binary.txt
            adb-version.txt
            emulator-binary.txt
            emulator-version.txt
            accel-check.txt
            kvm.txt
            zipalign-path.txt
            apksigner-path.txt
            zipalign-host-binary.txt
            apksigner-host-binary.txt
            avd-files.txt
            avd-list.txt
            device-abi.txt
            device-sdk.txt
            emulator.log
            diagnostics-vod-media-fallback/**
            runtime/**
          retention-days: 7
