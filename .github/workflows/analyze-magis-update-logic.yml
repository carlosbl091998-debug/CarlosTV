name: Analyze Magis update logic

on:
  push:
    paths:
      - 'tools/analyze_magis_update_logic.sh'
      - '.github/workflows/analyze-magis-update-logic.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover official Magis 6.2.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ARTIFACT_ID=9590851522
          EXPECTED_SHA=04bda60a0ebb003d1442483401978f39b601d989004d7b5e9c1f213a127d8835
          mkdir -p /tmp/magis624
          curl -fL --retry 4 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/magis624.zip
          unzip -q /tmp/magis624.zip -d /tmp/magis624
          cp /tmp/magis624/Xuper-Mobile-Official-Successor-Tested.apk Magis-6.2.4.apk
          echo "${EXPECTED_SHA}  Magis-6.2.4.apk" | sha256sum -c -
      - name: Analyze update logic
        run: bash tools/analyze_magis_update_logic.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: magis-update-logic-analysis
          path: diagnostics-update-logic/**
          retention-days: 7
