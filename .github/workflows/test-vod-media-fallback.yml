name: Test Xuper VOD media fallback on Android 16

on:
  workflow_dispatch:
  push:
    branches: [xuper-vod-media-fallback]
    paths:
      - 'tools/build_vod_media_fallback.sh'
      - 'tools/build_vod_v9_gadget.sh'
      - '.github/workflows/test-vod-media-fallback.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Build runtime media fallback candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/build_vod_media_fallback.sh

      - name: Verify packaged ARM64 VOD hook
        run: |
          set -euxo pipefail
          OUT='diagnostics-vod-media-fallback'
          APK="$OUT/Xuper-6.2.4-VOD-MediaFallback-Test.apk"
          unzip -l "$APK" | tee "$OUT/package-files.txt"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libgadget.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libgadget.config.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libgadget.script.so'
          unzip -p "$APK" lib/arm64-v8a/libgadget.script.so | tee "$OUT/vod-hook.js" | grep -aF 'XUPER_VOD_MEDIA'
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$OUT/apksigner-verify.txt"
          echo 'ARM64_VOD_HOOK_PACKAGE_OK' | tee "$OUT/package-result.txt"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Write strict 60 second Android 16 validation script
        run: |
          cat > /tmp/validate-vod-media.sh <<'BASH'
          #!/usr/bin/env bash
          set -euxo pipefail
          OUT='diagnostics-vod-media-fallback'
          APK="$OUT/Xuper-6.2.4-VOD-MediaFallback-Test.apk"
          PKG='com.msandroid.mobile'

          adb uninstall "$PKG" >/dev/null 2>&1 || true
          adb install -g "$APK" | tee "$OUT/install.txt"
          adb logcat -c
          adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 > "$OUT/launch.txt" 2>&1 || true

          # The APK is valid only if the same application process remains alive
          # continuously for a complete minute after launch.
          sleep 5
          INITIAL_PID=$(adb shell pidof "$PKG" | tr -d '\r' || true)
          echo "initial_pid=$INITIAL_PID" | tee "$OUT/runtime-result.txt"
          if [[ -z "$INITIAL_PID" ]]; then
            adb logcat -d -v threadtime > "$OUT/logcat.txt" || true
            echo 'PROCESS_NOT_ALIVE_AT_5S' | tee -a "$OUT/runtime-result.txt"
            exit 71
          fi

          for elapsed in 10 15 20 25 30 35 40 45 50 55 60; do
            sleep 5
            PID=$(adb shell pidof "$PKG" | tr -d '\r' || true)
            echo "t=${elapsed}s pid=$PID" | tee -a "$OUT/runtime-result.txt"
            if [[ -z "$PID" ]]; then
              adb logcat -d -v threadtime > "$OUT/logcat.txt" || true
              adb exec-out screencap -p > "$OUT/screen-failure-${elapsed}.png" || true
              echo "PROCESS_DIED_AT_${elapsed}S" | tee -a "$OUT/runtime-result.txt"
              exit 72
            fi
            if [[ "$PID" != "$INITIAL_PID" ]]; then
              adb logcat -d -v threadtime > "$OUT/logcat.txt" || true
              adb exec-out screencap -p > "$OUT/screen-restart-${elapsed}.png" || true
              echo "PROCESS_RESTARTED_AT_${elapsed}S old=$INITIAL_PID new=$PID" | tee -a "$OUT/runtime-result.txt"
              exit 73
            fi
          done

          adb exec-out screencap -p > "$OUT/screen-60.png" || true
          adb logcat -d -v threadtime > "$OUT/logcat.txt" || true
          grep -Ei 'XUPER_VOD_MEDIA|frida|gadget' "$OUT/logcat.txt" | tail -250 > "$OUT/gadget-log.txt" || true

          if grep -Eqi 'FATAL EXCEPTION|UnsatisfiedLinkError|SIGABRT|Fatal signal|SIGSEGV' "$OUT/logcat.txt"; then
            grep -Ein 'FATAL EXCEPTION|UnsatisfiedLinkError|SIGABRT|Fatal signal|SIGSEGV' "$OUT/logcat.txt" | tail -80
            echo 'FATAL_RUNTIME_ERROR_WITHIN_60S' | tee -a "$OUT/runtime-result.txt"
            exit 70
          fi

          echo 'ANDROID16_CONTINUOUS_60S_RUNTIME_OK' | tee -a "$OUT/runtime-result.txt"
          BASH
          chmod +x /tmp/validate-vod-media.sh

      - name: Require app alive continuously for 60 seconds on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash /tmp/validate-vod-media.sh

      - name: Upload candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuper-vod-media-fallback-candidate
          path: diagnostics-vod-media-fallback/**
          retention-days: 7
