name: Test ARM64-only NativeBridge 10-30-45

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-arm64-only-nativebridge-10-30-45.yml'

jobs:
  nativebridge-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ARTIFACT_ID: '9633216673'
      PACKAGE: com.msandroid.mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;35.0.0' >/dev/null
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Recover candidate and make ARM64-only package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p incoming diagnostics
          curl -fL --retry 4 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/candidate.zip
          unzip -q /tmp/candidate.zip -d incoming
          SRC=$(find incoming -type f -name '*.apk' | head -1)
          test -n "$SRC"
          cp "$SRC" source.apk
          python3 - <<'PY'
          import zipfile
          src='source.apk'; out='arm64-unsigned.apk'
          with zipfile.ZipFile(src) as z, zipfile.ZipFile(out,'w',allowZip64=True) as o:
              for it in z.infolist():
                  n=it.filename
                  if n.startswith('META-INF/'):
                      continue
                  if n.startswith('lib/') and not n.startswith('lib/arm64-v8a/'):
                      continue
                  d=z.read(n)
                  ni=zipfile.ZipInfo(n,it.date_time)
                  ni.compress_type=it.compress_type; ni.comment=it.comment; ni.extra=it.extra
                  ni.internal_attr=it.internal_attr; ni.external_attr=it.external_attr; ni.create_system=it.create_system
                  o.writestr(ni,d)
          PY
          zipalign -P 16 -f 4 arm64-unsigned.apk arm64-aligned.apk
          keytool -genkeypair -keystore /tmp/test.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US' >/dev/null 2>&1
          apksigner sign --ks /tmp/test.keystore --ks-pass pass:android --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out arm64-only.apk arm64-aligned.apk
          apksigner verify --verbose arm64-only.apk > diagnostics/signature.txt
          unzip -l arm64-only.apk | grep 'lib/' > diagnostics/libs.txt
          if grep -E 'lib/(x86|x86_64|armeabi-v7a)/' diagnostics/libs.txt; then exit 1; fi
          grep -q 'lib/arm64-v8a/' diagnostics/libs.txt
          sha256sum arm64-only.apk > diagnostics/sha256.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
      - name: Android 16 NativeBridge liveness
        id: runtime
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            mkdir -p diagnostics
            adb shell getprop ro.product.cpu.abi > diagnostics/device-abi.txt
            adb shell getprop ro.dalvik.vm.native.bridge > diagnostics/native-bridge.txt
            adb shell getprop ro.enable.native.bridge.exec > diagnostics/native-bridge-exec.txt
            adb uninstall com.msandroid.mobile >/dev/null 2>&1 || true
            adb install -g arm64-only.apk > diagnostics/install.txt 2>&1
            cat diagnostics/install.txt
            if ! grep -q Success diagnostics/install.txt; then echo INSTALL_FAIL > diagnostics/result.txt; exit 0; fi
            adb shell dumpsys package com.msandroid.mobile | grep -E 'primaryCpuAbi|secondaryCpuAbi' > diagnostics/package-abi.txt || true
            adb logcat -c
            adb shell monkey -p com.msandroid.mobile -c android.intent.category.LAUNCHER 1 > diagnostics/launch.txt 2>&1
            sleep 10
            adb shell pidof com.msandroid.mobile | tr -d '\r[:space:]' > diagnostics/pid10.txt
            if [ ! -s diagnostics/pid10.txt ]; then echo FAIL_AT_10 > diagnostics/result.txt; exit 0; fi
            PID=$(cat diagnostics/pid10.txt)
            adb shell cat /proc/$PID/maps | grep -E 'libijk|libijksdl|libijkffmpeg|arm64|native_bridge|ndk_translation|houdini' > diagnostics/maps10.txt || true
            sleep 20
            adb shell pidof com.msandroid.mobile | tr -d '\r[:space:]' > diagnostics/pid30.txt
            if [ ! -s diagnostics/pid30.txt ]; then echo FAIL_AT_30 > diagnostics/result.txt; exit 0; fi
            sleep 15
            adb shell pidof com.msandroid.mobile | tr -d '\r[:space:]' > diagnostics/pid45.txt
            if [ ! -s diagnostics/pid45.txt ]; then echo FAIL_AT_45 > diagnostics/result.txt; exit 0; fi
            echo PASS_45 > diagnostics/result.txt
      - name: Capture diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          adb logcat -d -v threadtime > diagnostics/logcat-full.txt 2>&1 || true
          grep -Eai 'FATAL EXCEPTION|AndroidRuntime|SIGSEGV|signal 11|tombstone|UnsatisfiedLinkError|dlopen failed|linker|ijk|ffmpeg|libsdl|native bridge|ndk_translation|houdini|DEBUG' diagnostics/logcat-full.txt > diagnostics/logcat-crash.txt || true
          cat diagnostics/result.txt 2>/dev/null || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-only-nativebridge-10-30-45
          path: |
            arm64-only.apk
            diagnostics/**
          retention-days: 7
      - name: Enforce pass
        if: always()
        shell: bash
        run: |
          test -f diagnostics/result.txt
          grep -q '^PASS_45$' diagnostics/result.txt
