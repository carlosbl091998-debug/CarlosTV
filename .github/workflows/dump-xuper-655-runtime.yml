name: Dump official Xuper 6.5.5 runtime DEX

on:
  workflow_dispatch:
  push:
    branches: [magis-frida-spawn-v2]
    paths:
      - '.github/workflows/dump-xuper-655-runtime.yml'

jobs:
  dump-xuper-655:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Download official Xuper 6.5.5 from app update endpoint
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 \
            -A 'Mozilla/5.0 (Linux; Android 16; Pixel 6) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36' \
            'https://gaeg.xvmobdes.com/download' -o /tmp/xuper655.bin
          if ! unzip -t /tmp/xuper655.bin >/dev/null 2>&1; then
            python3 - /tmp/xuper655.bin > /tmp/discovered-url.txt <<'PY' || true
          import re,sys,html
          raw=open(sys.argv[1],'rb').read(2000000).decode('utf-8','ignore')
          raw=html.unescape(raw).replace('\\/','/')
          for pat in [r'https?://[^\"\'<>\s]+?\.apk(?:\?[^\"\'<>\s]*)?', r'https?://[^\"\'<>\s]+?/download[^\"\'<>\s]*']:
              for m in re.finditer(pat,raw,re.I):
                  u=m.group(0)
                  if u!='https://gaeg.xvmobdes.com/download': print(u); raise SystemExit(0)
          raise SystemExit(1)
          PY
            u=$(head -1 /tmp/discovered-url.txt || true)
            test -n "$u"
            curl -fL --retry 5 --retry-all-errors -A 'Mozilla/5.0 (Linux; Android 16; Pixel 6)' -e 'https://gaeg.xvmobdes.com/download' "$u" -o /tmp/xuper655.bin
          fi
          unzip -t /tmp/xuper655.bin >/dev/null
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging /tmp/xuper655.bin | tee /tmp/badging.txt
          grep -q "package: name='com.msandroid.mobile' versionCode='60505' versionName='6.5.5'" /tmp/badging.txt
          cp /tmp/xuper655.bin Magis-6.2.4.apk
      - name: Install Frida tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'frida==17.2.17' 'frida-tools==14.4.5' frida-dexdump
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Dump decrypted runtime DEX on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/dump_magis_runtime_spawn.sh
      - name: Upload Xuper 6.5.5 runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuper-655-runtime-dexdump
          path: diagnostics624/**
          retention-days: 7
