name: Test SDL ARM64 candidate 10-30-45s

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-sdl-arm64-translated-10-30-45.yml'

jobs:
  arm64-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;35.0.0' >/dev/null
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Download tested SDL candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/carlosbl091998-debug/CarlosTV/actions/artifacts/9633216673/zip' \
            -o /tmp/sdl-artifact.zip
          mkdir -p /tmp/sdl-artifact
          unzip -q /tmp/sdl-artifact.zip -d /tmp/sdl-artifact
          cp /tmp/sdl-artifact/candidate-sdl.apk candidate-sdl.apk
          sha256sum candidate-sdl.apk
      - name: Force ARM64-only package and resign
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          src='candidate-sdl.apk'; out='arm64-only-unsigned.apk'
          with zipfile.ZipFile(src) as z, zipfile.ZipFile(out,'w',allowZip64=True) as o:
              for it in z.infolist():
                  p=it.filename
                  if p.startswith('META-INF/'):
                      continue
                  if p.startswith('lib/') and not p.startswith('lib/arm64-v8a/'):
                      continue
                  d=z.read(p)
                  n=zipfile.ZipInfo(p,it.date_time)
                  n.compress_type=it.compress_type
                  n.comment=it.comment; n.extra=it.extra
                  n.internal_attr=it.internal_attr; n.external_attr=it.external_attr
                  n.create_system=it.create_system
                  o.writestr(n,d)
          PY
          zipalign -P 16 -f 4 arm64-only-unsigned.apk arm64-only-aligned.apk
          keytool -genkeypair -keystore /tmp/test.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US' >/dev/null 2>&1
          apksigner sign --ks /tmp/test.keystore --ks-pass pass:android --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out arm64-only.apk arm64-only-aligned.apk
          apksigner verify --verbose --print-certs arm64-only.apk | tee signature.txt
          unzip -l arm64-only.apk | grep 'lib/' | tee libs.txt
          if grep -Eq 'lib/(x86|x86_64|armeabi-v7a)/' libs.txt; then exit 1; fi
          test -n "$(grep 'lib/arm64-v8a/' libs.txt)"
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android ${{ matrix.api }} translated ARM64 10-30-45
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            mkdir -p diagnostics
            adb shell getprop ro.product.cpu.abilist > diagnostics/abilist.txt
            adb shell getprop ro.dalvik.vm.native.bridge > diagnostics/native-bridge.txt
            adb shell getprop ro.enable.native.bridge.exec > diagnostics/native-bridge-exec.txt
            adb uninstall com.msandroid.mobile >/dev/null 2>&1 || true
            set +e
            adb install -g arm64-only.apk > diagnostics/install.txt 2>&1
            INSTALL_RC=$?
            set -e
            cat diagnostics/install.txt
            echo "$INSTALL_RC" > diagnostics/install-rc.txt
            if [ "$INSTALL_RC" -ne 0 ] || ! grep -q 'Success' diagnostics/install.txt; then
              echo INSTALL_FAIL > diagnostics/result.txt
              adb logcat -d -v threadtime > diagnostics/logcat.txt || true
              exit 0
            fi
            adb logcat -c
            adb shell monkey -p com.msandroid.mobile -c android.intent.category.LAUNCHER 1 > diagnostics/monkey.txt 2>&1 || true
            sleep 10
            adb shell pidof com.msandroid.mobile | tr -d '\r[:space:]' > diagnostics/pid10.txt || true
            adb shell dumpsys activity activities > diagnostics/activity10.txt || true
            sleep 20
            adb shell pidof com.msandroid.mobile | tr -d '\r[:space:]' > diagnostics/pid30.txt || true
            adb shell dumpsys activity activities > diagnostics/activity30.txt || true
            sleep 15
            adb shell pidof com.msandroid.mobile | tr -d '\r[:space:]' > diagnostics/pid45.txt || true
            adb shell dumpsys activity activities > diagnostics/activity45.txt || true
            adb logcat -d -v threadtime > diagnostics/logcat.txt || true
            adb logcat -b crash -d -v threadtime > diagnostics/crash-buffer.txt || true
            for t in 10 30 45; do
              echo "PID${t}=$(cat diagnostics/pid${t}.txt 2>/dev/null)"
            done | tee diagnostics/pids.txt
            if [ -s diagnostics/pid10.txt ] && [ -s diagnostics/pid30.txt ] && [ -s diagnostics/pid45.txt ]; then
              echo PASS_45 > diagnostics/result.txt
            else
              echo PROCESS_DIED > diagnostics/result.txt
            fi
            cat diagnostics/result.txt
      - name: Upload ARM64 runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdl-arm64-runtime-api${{ matrix.api }}-10-30-45
          path: |
            arm64-only.apk
            signature.txt
            libs.txt
            diagnostics/**
          retention-days: 7
