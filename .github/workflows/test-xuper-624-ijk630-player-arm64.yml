name: Test Xuper 6.2.4 with 6.3 arm64 IJK player

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-xuper-624-ijk630-player-arm64.yml'
      - 'donors/**'

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PKG: com.msandroid.mobile
      BASE_SHA256: 8ba6eb4a13bdec2d8d8ab06a1502194f488ce58d9fb6de7feeb1c539ef0f7b4e
      PLAYER630_SHA256: 6d47108c205f27a5a5867fac467da5b078ce71722f07611bf00ad0040390baeb
      PLAYER630_XZ_SHA256: 7e6284bb5c46b4349d196b08aaa2766e32667bfd010aa5dfc9c8dcb41d8f6c14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;35.0.0' >/dev/null
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Recover exact stable 6.2.4 checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/base
          curl -fL --retry 4 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/carlosbl091998-debug/CarlosTV/actions/artifacts/9623417943/zip' \
            -o /tmp/base.zip
          unzip -q /tmp/base.zip -d /tmp/base
          BASE=''
          while IFS= read -r candidate; do
            sha=$(sha256sum "$candidate" | awk '{print $1}')
            echo "candidate=$candidate sha=$sha"
            if [ "$sha" = "$BASE_SHA256" ]; then BASE="$candidate"; break; fi
          done < <(find /tmp/base -type f -name '*.apk' -print)
          test -n "$BASE"
          cp "$BASE" stable-624.apk
          test "$(sha256sum stable-624.apk | awk '{print $1}')" = "$BASE_SHA256"
          echo "BASE_OK=$BASE_SHA256"

      - name: Rebuild and verify 6.3 arm64 IJK player donor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, pathlib
          parts = [
              'donors/ijk630v3/part-00.b64',
              'donors/ijk630v2/part-01.b64',
              'donors/ijk630/part-02.b64',
              'donors/ijk630clean/part-03.b64',
              'donors/ijk630/part-04.b64',
              'donors/ijk630clean/part-05.b64',
              'donors/ijk630clean/part-06.b64',
              'donors/ijk630clean/part-07.b64',
              'donors/ijk630clean/part-08.b64',
              'donors/ijk630clean/part-09.b64',
              'donors/ijk630clean/part-10.b64',
              'donors/ijk630clean/part-11.b64',
              'donors/ijk630clean/part-12.b64',
              'donors/ijk630clean/part-13.b64',
          ]
          chunks=[]
          for i,p in enumerate(parts):
              s=''.join(pathlib.Path(p).read_text().split())
              if i < 13 and len(s) != 12000:
                  raise SystemExit(f'{p}: unexpected length {len(s)}')
              if i == 13 and len(s) != 11528:
                  raise SystemExit(f'{p}: unexpected length {len(s)}')
              if i == 12:
                  old='Fq82xlKlbs2Ev'; new='Fq82xlKpbs2Ev'
                  if s.count(old) != 1:
                      raise SystemExit('part-12 correction target count != 1')
                  s=s.replace(old,new,1)
              chunks.append(s)
              print(f'PART_{i:02d}=OK len={len(s)}')
          text=''.join(chunks)
          print('B64_TOTAL=',len(text))
          blob=base64.b64decode(text, validate=True)
          pathlib.Path('/tmp/libijkplayer-630.so.xz').write_bytes(blob)
          print('XZ_BYTES=',len(blob))
          print('XZ_SHA=',hashlib.sha256(blob).hexdigest())
          PY
          XZ_SHA=$(sha256sum /tmp/libijkplayer-630.so.xz | awk '{print $1}')
          test "$XZ_SHA" = "$PLAYER630_XZ_SHA256"
          xz -t /tmp/libijkplayer-630.so.xz
          xz -dc /tmp/libijkplayer-630.so.xz > libijkplayer-630.so
          PLAYER_SHA=$(sha256sum libijkplayer-630.so | awk '{print $1}')
          echo "PLAYER_SHA=$PLAYER_SHA"
          test "$PLAYER_SHA" = "$PLAYER630_SHA256"
          file libijkplayer-630.so
          readelf -h libijkplayer-630.so | tee /tmp/player-elf-header.txt
          grep -q 'Machine:.*AArch64' /tmp/player-elf-header.txt
          unzip -p stable-624.apk lib/arm64-v8a/libijkplayer.so > libijkplayer-624.so
          test "$(sha256sum libijkplayer-624.so | awk '{print $1}')" != "$PLAYER630_SHA256"
          echo 'PLAYER_DONOR=PASS'

      - name: Check native dependency surface
        shell: bash
        run: |
          set -euo pipefail
          readelf -d libijkplayer-624.so | grep NEEDED | tee /tmp/needed-624.txt || true
          readelf -d libijkplayer-630.so | grep NEEDED | tee /tmp/needed-630.txt || true

      - name: Build minimal hybrid APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          src='stable-624.apk'; out='hybrid-unsigned.apk'; target='lib/arm64-v8a/libijkplayer.so'
          replacement=open('libijkplayer-630.so','rb').read()
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(out,'w',allowZip64=True) as zout:
              for item in zin.infolist():
                  if item.filename.startswith('META-INF/') or item.filename==target:
                      continue
                  data=zin.read(item.filename)
                  ni=zipfile.ZipInfo(item.filename,item.date_time)
                  ni.compress_type=item.compress_type
                  ni.comment=item.comment; ni.extra=item.extra
                  ni.internal_attr=item.internal_attr; ni.external_attr=item.external_attr
                  ni.create_system=item.create_system
                  zout.writestr(ni,data)
              ni=zipfile.ZipInfo(target)
              ni.compress_type=zipfile.ZIP_STORED
              ni.external_attr=0o100755 << 16
              zout.writestr(ni,replacement)
          PY
          zipalign -P 16 -f 4 hybrid-unsigned.apk hybrid-aligned.apk
          keytool -genkeypair -v -keystore /tmp/test.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US' >/dev/null 2>&1
          apksigner sign --ks /tmp/test.keystore --ks-pass pass:android --key-pass pass:android \
            --out Xuper-6.2.4-IJK630-Player-arm64.apk hybrid-aligned.apk
          apksigner verify --verbose --print-certs Xuper-6.2.4-IJK630-Player-arm64.apk | tee /tmp/signature.txt

      - name: Verify minimal-diff invariants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics-ijk630
          for f in classes.dex resources.arsc; do
            A=$(unzip -p stable-624.apk "$f" | sha256sum | awk '{print $1}')
            B=$(unzip -p Xuper-6.2.4-IJK630-Player-arm64.apk "$f" | sha256sum | awk '{print $1}')
            echo "$f base=$A hybrid=$B" | tee -a diagnostics-ijk630/invariants.txt
            test "$A" = "$B"
          done
          A=$(unzip -p stable-624.apk lib/arm64-v8a/libijkplayer.so | sha256sum | awk '{print $1}')
          B=$(unzip -p Xuper-6.2.4-IJK630-Player-arm64.apk lib/arm64-v8a/libijkplayer.so | sha256sum | awk '{print $1}')
          echo "player base=$A hybrid=$B expected=$PLAYER630_SHA256" | tee -a diagnostics-ijk630/invariants.txt
          test "$B" = "$PLAYER630_SHA256"
          test "$A" != "$B"
          unzip -t Xuper-6.2.4-IJK630-Player-arm64.apk | tail -2 | tee diagnostics-ijk630/zip-test.txt
          sha256sum stable-624.apk Xuper-6.2.4-IJK630-Player-arm64.apk | tee diagnostics-ijk630/apk-sha256.txt
          cp /tmp/player-elf-header.txt /tmp/needed-624.txt /tmp/needed-630.txt /tmp/signature.txt diagnostics-ijk630/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            APK='Xuper-6.2.4-IJK630-Player-arm64.apk'
            adb uninstall "$PKG" >/dev/null 2>&1 || true
            adb install -g "$APK" | tee diagnostics-ijk630/install.txt
            grep -q 'Success' diagnostics-ijk630/install.txt
            adb logcat -c
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1
            sleep 8
            PID8=$(adb shell pidof "$PKG" | tr -d '\r[:space:]' || true)
            echo "PID_8S=$PID8" | tee diagnostics-ijk630/runtime.txt
            test -n "$PID8"
            sleep 12
            PID20=$(adb shell pidof "$PKG" | tr -d '\r[:space:]' || true)
            echo "PID_20S=$PID20" | tee -a diagnostics-ijk630/runtime.txt
            test -n "$PID20"
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | tee diagnostics-ijk630/activity.txt || true
            adb logcat -d -v threadtime | grep -Eai 'FATAL EXCEPTION|AndroidRuntime|UnsatisfiedLinkError|dlopen failed|linker|ijk|ffmpeg|player' | tail -600 > diagnostics-ijk630/runtime-errors.txt || true
            adb exec-out screencap -p > diagnostics-ijk630/screen-20s.png || true
            echo 'INSTALL_LAUNCH_ANDROID16=PASS' | tee -a diagnostics-ijk630/runtime.txt

      - name: Upload tested hybrid and diagnostics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xuper-624-ijk630-player-arm64-tested
          path: |
            Xuper-6.2.4-IJK630-Player-arm64.apk
            diagnostics-ijk630/**
          retention-days: 7
          if-no-files-found: error
