name: Validate static Xuper VOD fallback on macOS ARM64 Android 16

on:
  workflow_dispatch:
  push:
    branches: [xuper-vod-media-fallback]
    paths:
      - 'tools/build_vod_media_fallback.sh'
      - '.github/workflows/test-vod-media-fallback-macos-arm64.yml'

jobs:
  build-and-test-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env:
      PACKAGE: com.msandroid.mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify ARM64 host and install Android 16 ARM64 emulator image
        shell: bash
        run: |
          set -euo pipefail
          uname -a | tee host.txt
          uname -m | tee host-arch.txt
          test "$(uname -m)" = 'arm64'
          echo "ANDROID_HOME=${ANDROID_HOME:-$HOME/Library/Android/sdk}" | tee -a "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platform-tools' 'emulator' 'build-tools;35.0.0' 'system-images;android-36;google_apis;arm64-v8a' >/dev/null
          emulator -version 2>&1 | tee emulator-version.txt
          adb version | tee adb-version.txt
          file "$(command -v emulator)" | tee emulator-binary.txt
          file "$(command -v adb)" | tee adb-binary.txt

      - name: Build static VOD fallback without Frida
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          bash tools/build_vod_media_fallback.sh
          CANDIDATE='diagnostics-vod-media-fallback/Xuper-6.2.4-VOD-StaticFallback-NoFrida.apk'
          test -s "$CANDIDATE"
          cp "$CANDIDATE" candidate.apk
          sha256sum candidate.apk | tee candidate-sha256.txt
          unzip -l candidate.apk > package-files.txt
          if grep -Eqi 'libgadget|VodFixProvider' package-files.txt; then
            echo 'FORBIDDEN_FRIDA_COMPONENT_FOUND' >&2
            exit 41
          fi

      - name: Create Android 16 ARM64 AVD
        shell: bash
        run: |
          set -euo pipefail
          echo no | avdmanager create avd -n arm64_api36 -k 'system-images;android-36;google_apis;arm64-v8a' -d pixel_6 --force
          emulator -list-avds | tee avd-list.txt
          grep -qx 'arm64_api36' avd-list.txt

      - name: Start ARM64 emulator in software mode
        shell: bash
        run: |
          set -euo pipefail
          nohup emulator -avd arm64_api36 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -no-metrics -no-accel > emulator.log 2>&1 &
          echo $! > emulator.pid
          for i in $(seq 1 600); do
            if adb devices | grep -q 'emulator-.*device'; then
              BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$BOOT" = '1' ]; then break; fi
            fi
            if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then
              echo 'EMULATOR_EXITED_EARLY' >&2
              cat emulator.log >&2 || true
              exit 70
            fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1'
          adb shell getprop ro.product.cpu.abi | tee device-abi.txt
          grep -q '^arm64-v8a$' device-abi.txt
          adb shell getprop ro.build.version.sdk | tee device-sdk.txt
          grep -q '^36$' device-sdk.txt

      - name: Enforce 10 30 45 second liveness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          adb uninstall "$PACKAGE" >/dev/null 2>&1 || true
          adb install -g candidate.apk | tee runtime/install.txt
          grep -q 'Success' runtime/install.txt
          adb logcat -c
          adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1 > runtime/launch.txt 2>&1
          sleep 3
          INITIAL_PID=$(adb shell pidof "$PACKAGE" | tr -d '\r[:space:]')
          test -n "$INITIAL_PID"
          echo "$INITIAL_PID" | tee runtime/pid-initial.txt
          START=$(date +%s)
          for target in 10 30 45; do
            while [ $(( $(date +%s) - START )) -lt "$target" ]; do sleep 1; done
            PID=$(adb shell pidof "$PACKAGE" | tr -d '\r[:space:]')
            printf '%s %s\n' "$target" "$PID" | tee -a runtime/pid-samples.txt
            test -n "$PID"
            test "$PID" = "$INITIAL_PID"
          done
          adb logcat -d -v threadtime > runtime/logcat.txt
          adb logcat -b crash -d -v threadtime > runtime/crash-buffer.txt || true
          if grep -Eqi 'FATAL EXCEPTION|UnsatisfiedLinkError|SIGABRT|Fatal signal|SIGSEGV' runtime/logcat.txt runtime/crash-buffer.txt; then
            echo 'FATAL_RUNTIME_SIGNATURE_FOUND' | tee runtime/result.txt
            exit 74
          fi
          echo 'ANDROID16_MACOS_NATIVE_ARM64_LIVENESS_10_30_45_OK' | tee runtime/result.txt

      - name: Capture diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p runtime
          adb exec-out screencap -p > runtime/final-screen.png 2>/dev/null || true
          adb logcat -d -v threadtime > runtime/logcat-final.txt 2>/dev/null || true
          adb logcat -b crash -d -v threadtime > runtime/crash-final.txt 2>/dev/null || true
          adb shell dumpsys activity activities > runtime/activities.txt 2>/dev/null || true
          adb shell pidof "$PACKAGE" > runtime/pid-final.txt 2>/dev/null || true

      - name: Upload candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuper-vod-static-fallback-macos-arm64
          path: |
            candidate.apk
            candidate-sha256.txt
            host.txt
            host-arch.txt
            emulator-version.txt
            adb-version.txt
            emulator-binary.txt
            adb-binary.txt
            avd-list.txt
            device-abi.txt
            device-sdk.txt
            emulator.log
            diagnostics-vod-media-fallback/**
            runtime/**
          retention-days: 7
