name: Test Xuper mobile 6.5.5 Android 16 10-30-45

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-official-xuper-655-android16.yml'

permissions:
  contents: read

jobs:
  test-official-655:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Resolve AFTV redirect and public Gofile folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import hashlib, html, json, os, re, sys, time
          import requests

          aftv='https://aftvnews.com/3154861'
          ua='Mozilla/5.0 (Linux; Android 16; Pixel 6) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'
          s=requests.Session()
          s.headers.update({'User-Agent':ua})

          r=s.get(aftv,timeout=30)
          r.raise_for_status()
          raw=html.unescape(r.text).replace('\\/','/')
          m=re.search(r'https://gofile\.io/d/([A-Za-z0-9]+)',raw,re.I)
          if not m:
              open('out/landing-preview.txt','w').write(raw[:100000])
              raise SystemExit('AFTV page did not contain a Gofile folder URL')
          code=m.group(1)

          def website_token(account_token=''):
              slot=int(time.time())//14400
              material=f'{ua}::en-US::{account_token}::{slot}::12af056dacea0b'
              return hashlib.sha256(material.encode()).hexdigest()

          ar=s.post('https://api.gofile.io/accounts',headers={
              'X-Website-Token':website_token(''),
              'X-BL':'en-US'
          },timeout=30)
          ar.raise_for_status()
          aj=ar.json()
          if aj.get('status')!='ok' or not aj.get('data',{}).get('token'):
              raise SystemExit(f'Gofile guest account creation failed: {aj.get("status")}')
          token=aj['data']['token']
          s.headers.update({'Authorization':f'Bearer {token}'})

          files=[]
          seen=set()
          def walk(content_id):
              if content_id in seen: return
              seen.add(content_id)
              rr=s.get(f'https://api.gofile.io/contents/{content_id}?cache=true&sortField=createTime&sortDirection=1',headers={
                  'X-Website-Token':website_token(token),
                  'X-BL':'en-US'
              },timeout=30)
              rr.raise_for_status()
              jj=rr.json()
              if jj.get('status')!='ok':
                  raise RuntimeError(f'Gofile content lookup failed for {content_id}: {jj.get("status")}')
              data=jj.get('data',{})
              children=data.get('children') or {}
              if isinstance(children,list):
                  iterable=children
              else:
                  iterable=children.values()
              for child in iterable:
                  if child.get('type')=='folder':
                      walk(child['id'])
                  elif child.get('type')=='file':
                      files.append(child)
          walk(code)

          apks=[f for f in files if str(f.get('name','')).lower().endswith('.apk') and f.get('link')]
          if not apks:
              open('out/gofile-file-list.txt','w').write('\n'.join(str(f.get('name','')) for f in files))
              raise SystemExit('No APK found in Gofile folder')
          apks.sort(key=lambda f:int(f.get('size') or 0), reverse=True)
          f=apks[0]
          name=str(f.get('name'))
          link=str(f.get('link'))
          size=int(f.get('size') or 0)
          with s.get(link,stream=True,timeout=60) as dr:
              dr.raise_for_status()
              with open('/tmp/xuper.bin','wb') as out:
                  for chunk in dr.iter_content(1024*1024):
                      if chunk: out.write(chunk)
          actual=os.path.getsize('/tmp/xuper.bin')
          if size and actual != size:
              raise SystemExit(f'Gofile size mismatch: expected {size}, got {actual}')
          with open('out/source.txt','w') as o:
              o.write(f'AFTV_CODE=3154861\nGOFILE_FOLDER={code}\nFILE_NAME={name}\nFILE_SIZE={actual}\n')
          PY
          unzip -t /tmp/xuper.bin >/dev/null
          cp /tmp/xuper.bin out/Xuper-6.5.5-candidate.apk
          sha256sum out/Xuper-6.5.5-candidate.apk | tee out/sha256.txt

      - name: Validate exact package version and original signer
        shell: bash
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging out/Xuper-6.5.5-candidate.apk | tee out/badging.txt
          grep -q "package: name='com.msandroid.mobile'" out/badging.txt
          grep -q "versionCode='60505'" out/badging.txt
          grep -q "versionName='6.5.5'" out/badging.txt
          "$APKSIGNER" verify --verbose --print-certs out/Xuper-6.5.5-candidate.apk | tee out/signing.txt
          grep -qi 'd30dc60fd8625d49fa4e82eb442c9307743f9621004b94e229dcc01f6a9035ff' out/signing.txt
          cp out/Xuper-6.5.5-candidate.apk out/Xuper-6.5.5-original-signer.apk
          echo 'IDENTITY_655_AND_ORIGINAL_SIGNER=PASS' | tee out/identity-result.txt

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 install and 10-30-45 liveness
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -eu
            adb install -r out/Xuper-6.5.5-original-signer.apk > out/install.txt 2>&1 || { cat out/install.txt; exit 11; }
            cat out/install.txt
            adb logcat -c
            adb shell am force-stop com.msandroid.mobile
            adb shell monkey -p com.msandroid.mobile -c android.intent.category.LAUNCHER 1 > out/launch.txt 2>&1 || true
            sleep 10
            P10=$(adb shell pidof com.msandroid.mobile | tr -d '\r' || true)
            echo "PID_10=$P10" | tee out/pid10.txt
            [ -n "$P10" ] || { adb logcat -d > out/logcat.txt; exit 12; }
            sleep 20
            P30=$(adb shell pidof com.msandroid.mobile | tr -d '\r' || true)
            echo "PID_30=$P30" | tee out/pid30.txt
            [ -n "$P30" ] || { adb logcat -d > out/logcat.txt; exit 13; }
            sleep 15
            P45=$(adb shell pidof com.msandroid.mobile | tr -d '\r' || true)
            echo "PID_45=$P45" | tee out/pid45.txt
            adb shell dumpsys activity activities > out/activity.txt || true
            adb logcat -d > out/logcat.txt || true
            [ -n "$P45" ] || exit 14
            ! grep -E 'FATAL EXCEPTION|SIGSEGV|UnsatisfiedLinkError' out/logcat.txt | grep 'com.msandroid.mobile' || exit 15
            echo 'LIVENESS_10_30_45=PASS' | tee out/result.txt

      - name: Upload candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuper-mobile-655-original-signer-android16-10-30-45
          path: out/**
          retention-days: 7
