name: Validate VOD candidate on Redroid Android 15 ARM64

on:
  workflow_dispatch:
  push:
    branches: [xuper-vod-media-fallback]
    paths:
      - '.github/workflows/test-redroid-arm64-android15.yml'

jobs:
  redroid-arm64-liveness:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      PACKAGE: com.msandroid.mobile
      SOURCE_ARTIFACT_ID: '9701400558'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare host, adb and candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-tools-adb curl unzip kmod gcc linux-libc-dev >/dev/null
          uname -a | tee host-uname.txt
          curl -fL --retry 4 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o source.zip
          mkdir source && unzip -q source.zip -d source
          cp source/candidate.apk candidate.apk
          sha256sum candidate.apk | tee candidate-sha256.txt
      - name: Create Binder devices and start Android 15 ARM64 container
        run: |
          set -euo pipefail
          KREL="$(uname -r)"
          sudo apt-get install -y -qq "linux-modules-extra-${KREL}" >/dev/null 2>&1 || true
          sudo depmod -a || true
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          sudo mkdir -p /dev/binderfs
          if ! mountpoint -q /dev/binderfs; then sudo mount -t binder binder /dev/binderfs; fi
          cat > /tmp/mkbinder.c <<'EOF'
          #include <errno.h>
          #include <fcntl.h>
          #include <stdio.h>
          #include <sys/ioctl.h>
          #include <unistd.h>
          #include <linux/android/binderfs.h>
          static int add(int fd, const char *name) {
            struct binderfs_device d = {0};
            snprintf(d.name, sizeof(d.name), "%s", name);
            if (ioctl(fd, BINDER_CTL_ADD, &d) == 0 || errno == EEXIST) return 0;
            perror(name); return 1;
          }
          int main(void) {
            int fd = open("/dev/binderfs/binder-control", O_RDONLY | O_CLOEXEC);
            if (fd < 0) return 2;
            int rc = add(fd,"binder") | add(fd,"hwbinder") | add(fd,"vndbinder");
            close(fd); return rc;
          }
          EOF
          gcc -O2 /tmp/mkbinder.c -o /tmp/mkbinder
          sudo /tmp/mkbinder || true
          for n in binder hwbinder vndbinder; do
            test -e "/dev/binderfs/$n"
            sudo chmod 666 "/dev/binderfs/$n" || true
          done
          docker pull redroid/redroid:15.0.0_64only-latest
          docker image inspect redroid/redroid:15.0.0_64only-latest --format '{{.Architecture}} {{.Os}}' | tee image-platform.txt
          grep -qx 'arm64 linux' image-platform.txt
          docker rm -f redroid15 >/dev/null 2>&1 || true
          docker run -d --privileged \
            --name redroid15 \
            -p 5555:5555 \
            -v /dev/binderfs:/dev/binderfs \
            redroid/redroid:15.0.0_64only-latest \
            androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_width=1080 \
            androidboot.redroid_height=2400 \
            androidboot.redroid_dpi=420 | tee container-id.txt
      - name: Wait for Android 15 and verify ARM64
        run: |
          set -euo pipefail
          mkdir -p runtime bootdiag
          adb start-server
          START=$(date +%s)
          for i in $(seq 1 120); do
            adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            if adb -s 127.0.0.1:5555 get-state 2>/dev/null | grep -qx device; then
              BOOT=$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$BOOT" = 1 ]; then
                echo "BOOT_SECONDS=$(( $(date +%s)-START ))" | tee boot-time.txt
                break
              fi
            fi
            if [ "$i" = 120 ]; then exit 72; fi
            sleep 2
          done
          adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi | tee device-abi.txt
          grep -qx arm64-v8a device-abi.txt
          adb -s 127.0.0.1:5555 shell getprop ro.build.version.sdk | tee device-sdk.txt
          grep -qx 35 device-sdk.txt
          adb -s 127.0.0.1:5555 shell getprop ro.build.version.release | tee device-release.txt
      - name: Install and enforce 10 30 45 second liveness
        run: |
          set -euo pipefail
          adb -s 127.0.0.1:5555 install -r -g candidate.apk | tee runtime/install.txt
          grep -q Success runtime/install.txt
          adb -s 127.0.0.1:5555 logcat -c
          adb -s 127.0.0.1:5555 shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER --pct-syskeys 0 --pct-appswitch 0 --pct-anyevent 0 1 > runtime/launch.txt 2>&1
          sleep 3
          PID=$(adb -s 127.0.0.1:5555 shell pidof "$PACKAGE" | tr -d '\r[:space:]')
          test -n "$PID"
          echo "$PID" > runtime/pid-initial.txt
          START=$(date +%s)
          for T in 10 30 45; do
            while [ $(( $(date +%s)-START )) -lt "$T" ]; do sleep 1; done
            P=$(adb -s 127.0.0.1:5555 shell pidof "$PACKAGE" | tr -d '\r[:space:]')
            echo "$T $P" | tee -a runtime/pid-samples.txt
            test "$P" = "$PID"
          done
          adb -s 127.0.0.1:5555 logcat -d -v threadtime > runtime/logcat.txt
          adb -s 127.0.0.1:5555 logcat -b crash -d -v threadtime > runtime/crash.txt || true
          ! grep -Eqi 'FATAL EXCEPTION|UnsatisfiedLinkError|SIGABRT|Fatal signal|SIGSEGV' runtime/logcat.txt runtime/crash.txt
          echo ANDROID15_ARM64_LIVENESS_10_30_45_OK | tee runtime/result.txt
      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p runtime
          adb -s 127.0.0.1:5555 shell getprop > runtime/getprop.txt 2>/dev/null || true
          adb -s 127.0.0.1:5555 logcat -d -v threadtime > runtime/logcat-final.txt 2>/dev/null || true
          docker logs redroid15 > runtime/redroid-docker.log 2>&1 || true
      - name: Upload tested APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuper-vod-redroid15-arm64-validated
          path: |
            candidate.apk
            candidate-sha256.txt
            image-platform.txt
            container-id.txt
            boot-time.txt
            device-abi.txt
            device-sdk.txt
            device-release.txt
            runtime/**
          retention-days: 7
