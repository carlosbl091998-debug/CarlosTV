name: Test Magis 5.13.6 normal update close

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  magis-5136-close-update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Download original signed Magis 5.13.6
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4 --retry-all-errors -A 'Mozilla/5.0' 'https://tinyurl.com/Magis-TV-File' -o magis-5136.apk
          unzip -t magis-5136.apk >/dev/null
          echo '2b20454e1144ccd4d94d70744a22a470a7738cb4251db1437b6808c417b061d3  magis-5136.apk' | sha256sum -c -
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging magis-5136.apk | tee magis-5136-badging.txt
          grep -q "versionName='5.13.6'" magis-5136-badging.txt
          "$APKSIGNER" verify --verbose --print-certs magis-5136.apk | tee magis-5136-signing.txt
          grep -qi 'd30dc60fd8625d49fa4e82eb442c9307743f9621004b94e229dcc01f6a9035ff' magis-5136-signing.txt
          mkdir -p diagnostics-magis-5136-close
          cp magis-5136-badging.txt magis-5136-signing.txt diagnostics-magis-5136-close/

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Close update using Magis own X and smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/test_magis_5136_close_update.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magis-5136-normal-close-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: diagnostics-magis-5136-close/**
