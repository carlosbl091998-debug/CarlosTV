name: Test Xuper 6.2.4 with coherent current ARM64 IJK bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-xuper-624-current-ijk-bundle.yml'

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PKG: com.msandroid.mobile
      BASE_SHA256: 8ba6eb4a13bdec2d8d8ab06a1502194f488ce58d9fb6de7feeb1c539ef0f7b4e
      PLAYER_SHA256: 2f319dd0f4dd2df9160b79bd64403466b212a185648e5f8c278c42f2bd62f223
      FFMPEG_SHA256: dcae2fb5a8bde99a8f6fcca44534fbf824f6e6e7b42d14d9c3bb74820f0be754
      SDL_SHA256: 2257b00c4969e6f8aaed5751e997b83921ebf91d24b9d75bfe7dd14df2be150a

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;35.0.0' >/dev/null
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Recover exact stable 6.2.4 checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/base
          curl -fL --retry 4 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/carlosbl091998-debug/CarlosTV/actions/artifacts/9623417943/zip' \
            -o /tmp/base.zip
          unzip -q /tmp/base.zip -d /tmp/base
          BASE=''
          while IFS= read -r candidate; do
            sha=$(sha256sum "$candidate" | awk '{print $1}')
            if [ "$sha" = "$BASE_SHA256" ]; then BASE="$candidate"; break; fi
          done < <(find /tmp/base -type f -name '*.apk' -print)
          test -n "$BASE"
          cp "$BASE" stable-624.apk
          test "$(sha256sum stable-624.apk | awk '{print $1}')" = "$BASE_SHA256"
          echo "BASE_OK=$BASE_SHA256"

      - name: Recover coherent current ARM64 IJK bundle from GitHub artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/donor donor
          curl -fL --retry 4 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/carlosbl091998-debug/CarlosTV/actions/artifacts/9632074487/zip' \
            -o /tmp/donor.zip
          unzip -q /tmp/donor.zip -d /tmp/donor
          find /tmp/donor -type f -maxdepth 3 -print
          cp "$(find /tmp/donor -type f -name libijkplayer.so -print -quit)" donor/libijkplayer.so
          cp "$(find /tmp/donor -type f -name libijkffmpeg.so -print -quit)" donor/libijkffmpeg.so
          cp "$(find /tmp/donor -type f -name libijksdl.so -print -quit)" donor/libijksdl.so
          test "$(sha256sum donor/libijkplayer.so | awk '{print $1}')" = "$PLAYER_SHA256"
          test "$(sha256sum donor/libijkffmpeg.so | awk '{print $1}')" = "$FFMPEG_SHA256"
          test "$(sha256sum donor/libijksdl.so | awk '{print $1}')" = "$SDL_SHA256"
          file donor/*.so
          readelf -h donor/libijkplayer.so | grep -E 'Class:|Machine:'
          readelf -h donor/libijkffmpeg.so | grep -E 'Class:|Machine:'
          readelf -h donor/libijksdl.so | grep -E 'Class:|Machine:'
          echo 'CURRENT_ARM64_IJK_BUNDLE=PASS'

      - name: Build and sign hybrid
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics-current-ijk
          python3 - <<'PY'
          import zipfile
          src='stable-624.apk'
          out='hybrid-unsigned.apk'
          targets={
              'lib/arm64-v8a/libijkplayer.so': open('donor/libijkplayer.so','rb').read(),
              'lib/arm64-v8a/libijkffmpeg.so': open('donor/libijkffmpeg.so','rb').read(),
              'lib/arm64-v8a/libijksdl.so': open('donor/libijksdl.so','rb').read(),
          }
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(out,'w',allowZip64=True) as zout:
              for item in zin.infolist():
                  if item.filename.startswith('META-INF/') or item.filename in targets:
                      continue
                  data=zin.read(item.filename)
                  ni=zipfile.ZipInfo(item.filename,item.date_time)
                  ni.compress_type=item.compress_type
                  ni.comment=item.comment
                  ni.extra=item.extra
                  ni.internal_attr=item.internal_attr
                  ni.external_attr=item.external_attr
                  ni.create_system=item.create_system
                  zout.writestr(ni,data)
              for path,data in targets.items():
                  ni=zipfile.ZipInfo(path)
                  ni.compress_type=zipfile.ZIP_STORED
                  ni.external_attr=0o100755 << 16
                  zout.writestr(ni,data)
          PY
          zipalign -P 16 -f 4 hybrid-unsigned.apk hybrid-aligned.apk
          keytool -genkeypair -keystore /tmp/test.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US' >/dev/null 2>&1
          apksigner sign --ks /tmp/test.keystore --ks-pass pass:android --key-pass pass:android \
            --out Xuper-6.2.4-Current-IJK-Bundle-arm64.apk hybrid-aligned.apk
          apksigner verify --verbose --print-certs Xuper-6.2.4-Current-IJK-Bundle-arm64.apk | tee diagnostics-current-ijk/signature.txt

      - name: Verify exact modifications
        shell: bash
        run: |
          set -euo pipefail
          for f in classes.dex resources.arsc; do
            A=$(unzip -p stable-624.apk "$f" | sha256sum | awk '{print $1}')
            B=$(unzip -p Xuper-6.2.4-Current-IJK-Bundle-arm64.apk "$f" | sha256sum | awk '{print $1}')
            echo "$f base=$A hybrid=$B" | tee -a diagnostics-current-ijk/invariants.txt
            test "$A" = "$B"
          done
          for f in libijkplayer.so libijkffmpeg.so libijksdl.so; do
            A=$(unzip -p Xuper-6.2.4-Current-IJK-Bundle-arm64.apk "lib/arm64-v8a/$f" | sha256sum | awk '{print $1}')
            B=$(sha256sum "donor/$f" | awk '{print $1}')
            echo "$f hybrid=$A donor=$B" | tee -a diagnostics-current-ijk/invariants.txt
            test "$A" = "$B"
          done
          unzip -t Xuper-6.2.4-Current-IJK-Bundle-arm64.apk | tail -2 | tee diagnostics-current-ijk/zip-test.txt
          sha256sum Xuper-6.2.4-Current-IJK-Bundle-arm64.apk | tee diagnostics-current-ijk/apk-sha256.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on Android 16 x86_64
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb shell getprop ro.product.cpu.abi | tee diagnostics-current-ijk/emulator-abi.txt
            adb uninstall com.msandroid.mobile >/dev/null 2>&1 || true
            adb install -g Xuper-6.2.4-Current-IJK-Bundle-arm64.apk | tee diagnostics-current-ijk/install.txt
            grep -q 'Success' diagnostics-current-ijk/install.txt
            adb logcat -c
            adb shell monkey -p com.msandroid.mobile -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1
            sleep 8
            adb shell pidof com.msandroid.mobile | tr -d '\r[:space:]' | tee diagnostics-current-ijk/pid8.txt
            test -s diagnostics-current-ijk/pid8.txt
            sleep 12
            adb shell pidof com.msandroid.mobile | tr -d '\r[:space:]' | tee diagnostics-current-ijk/pid20.txt
            test -s diagnostics-current-ijk/pid20.txt
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | tee diagnostics-current-ijk/activity.txt || true
            adb logcat -d -v threadtime | grep -Eai 'FATAL EXCEPTION|AndroidRuntime|UnsatisfiedLinkError|dlopen failed|linker|ijk|ffmpeg|player' | tail -600 > diagnostics-current-ijk/runtime-errors.txt || true
            adb exec-out screencap -p > diagnostics-current-ijk/screen-20s.png || true
            echo 'INSTALL_LAUNCH_ANDROID16_X86_64=PASS' | tee diagnostics-current-ijk/result.txt

      - name: Upload tested hybrid
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xuper-624-current-ijk-bundle-arm64-tested
          path: |
            Xuper-6.2.4-Current-IJK-Bundle-arm64.apk
            diagnostics-current-ijk/**
          retention-days: 7
          if-no-files-found: error
