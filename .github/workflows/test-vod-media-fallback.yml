name: Probe static Xuper VOD mapper without Frida

on:
  workflow_dispatch:
  push:
    branches: [xuper-vod-media-fallback]
    paths:
      - 'tools/build_vod_media_fallback.sh'
      - '.github/workflows/test-vod-media-fallback.yml'

jobs:
  static-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Extract static runtime VOD mapper
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/build_vod_media_fallback.sh
      - name: Upload static mapper diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuper-vod-static-mapper-probe
          path: diagnostics-vod-media-fallback/**
          retention-days: 7
