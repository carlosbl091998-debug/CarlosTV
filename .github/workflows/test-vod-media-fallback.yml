name: Test Xuper VOD media fallback on native ARM64 Android 16

on:
  workflow_dispatch:
  push:
    branches: [xuper-vod-media-fallback]
    paths:
      - 'tools/build_vod_media_fallback.sh'
      - 'tools/build_vod_v9_gadget.sh'
      - '.github/workflows/test-vod-media-fallback.yml'

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Prepare native ARM64 Android 16 emulator
        shell: bash
        run: |
          set -euxo pipefail
          uname -a | tee host.txt
          test "$(uname -m)" = 'arm64'
          sdkmanager 'platform-tools' 'emulator' 'build-tools;35.0.0' 'system-images;android-36;google_apis;arm64-v8a' >/dev/null
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Build runtime media fallback candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/build_vod_media_fallback.sh

      - name: Verify packaged ARM64 VOD hook
        shell: bash
        run: |
          set -euxo pipefail
          OUT='diagnostics-vod-media-fallback'
          APK="$OUT/Xuper-6.2.4-VOD-MediaFallback-Test.apk"
          unzip -l "$APK" | tee "$OUT/package-files.txt"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libgadget.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libgadget.config.so'
          unzip -p "$APK" lib/arm64-v8a/libgadget.script.so | tee "$OUT/vod-hook.js" | grep -aF 'XUPER_VOD_MEDIA'
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$OUT/apksigner-verify.txt"
          echo 'ARM64_VOD_HOOK_PACKAGE_OK' | tee "$OUT/package-result.txt"

      - name: Create ARM64 AVD
        shell: bash
        run: |
          set -euxo pipefail
          echo no | avdmanager create avd -n arm64_api36 -k 'system-images;android-36;google_apis;arm64-v8a' -d pixel_6 --force

      - name: Start native ARM64 emulator
        shell: bash
        run: |
          set -euxo pipefail
          adb kill-server || true
          pkill -f 'emulator.*arm64_api36' || true
          nohup emulator -avd arm64_api36 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -accel on > emulator.log 2>&1 &
          EMU_PID=$!
          echo "$EMU_PID" > emulator.pid

          # Native arm64 guest on the arm64 macOS runner must use hardware acceleration.
          # Fail fast instead of hanging indefinitely if boot never completes.
          deadline=$((SECONDS + 360))
          while (( SECONDS < deadline )); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo 'EMULATOR_PROCESS_EXITED_BEFORE_BOOT' >&2
              tail -200 emulator.log || true
              exit 81
            fi
            if adb devices | grep -q '^emulator-'; then
              BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$BOOT" = '1' ]; then
                break
              fi
            fi
            sleep 5
          done

          BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
          if [ "$BOOT" != '1' ]; then
            echo 'EMULATOR_BOOT_TIMEOUT_360S' >&2
            adb devices -l || true
            tail -300 emulator.log || true
            exit 82
          fi

          adb shell input keyevent 82 || true
          adb shell getprop ro.product.cpu.abi | tee device-abi.txt
          adb shell getprop ro.product.cpu.abilist | tee device-abis.txt
          grep -q '^arm64-v8a' device-abi.txt
          echo 'ANDROID16_NATIVE_ARM64_BOOT_OK'

      - name: Require same app process alive continuously for 60 seconds
        shell: bash
        run: |
          set -euxo pipefail
          OUT='diagnostics-vod-media-fallback'
          APK="$OUT/Xuper-6.2.4-VOD-MediaFallback-Test.apk"
          PKG='com.msandroid.mobile'

          adb uninstall "$PKG" >/dev/null 2>&1 || true
          adb install -g "$APK" | tee "$OUT/install.txt"
          adb logcat -c
          adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 > "$OUT/launch.txt" 2>&1 || true

          sleep 5
          INITIAL_PID=$(adb shell pidof "$PKG" | tr -d '\r[:space:]' || true)
          echo "initial_pid=$INITIAL_PID" | tee "$OUT/runtime-result.txt"
          if [[ -z "$INITIAL_PID" ]]; then
            adb logcat -d -v threadtime > "$OUT/logcat.txt" || true
            adb logcat -b crash -d -v threadtime > "$OUT/crash-buffer.txt" || true
            echo 'PROCESS_NOT_ALIVE_AT_5S' | tee -a "$OUT/runtime-result.txt"
            exit 71
          fi

          for elapsed in 10 15 20 25 30 35 40 45 50 55 60; do
            sleep 5
            PID=$(adb shell pidof "$PKG" | tr -d '\r[:space:]' || true)
            echo "t=${elapsed}s pid=$PID" | tee -a "$OUT/runtime-result.txt"
            if [[ -z "$PID" ]]; then
              adb logcat -d -v threadtime > "$OUT/logcat.txt" || true
              adb logcat -b crash -d -v threadtime > "$OUT/crash-buffer.txt" || true
              adb exec-out screencap -p > "$OUT/screen-failure-${elapsed}.png" || true
              echo "PROCESS_DIED_AT_${elapsed}S" | tee -a "$OUT/runtime-result.txt"
              exit 72
            fi
            if [[ "$PID" != "$INITIAL_PID" ]]; then
              adb logcat -d -v threadtime > "$OUT/logcat.txt" || true
              adb logcat -b crash -d -v threadtime > "$OUT/crash-buffer.txt" || true
              adb exec-out screencap -p > "$OUT/screen-restart-${elapsed}.png" || true
              echo "PROCESS_RESTARTED_AT_${elapsed}S old=$INITIAL_PID new=$PID" | tee -a "$OUT/runtime-result.txt"
              exit 73
            fi
          done

          adb exec-out screencap -p > "$OUT/screen-60.png" || true
          adb logcat -d -v threadtime > "$OUT/logcat.txt" || true
          adb logcat -b crash -d -v threadtime > "$OUT/crash-buffer.txt" || true
          grep -Ei 'XUPER_VOD_MEDIA|frida|gadget|secneo|libDexHelper' "$OUT/logcat.txt" | tail -300 > "$OUT/runtime-key-log.txt" || true

          if grep -Eqi 'FATAL EXCEPTION|UnsatisfiedLinkError|SIGABRT|Fatal signal|SIGSEGV' "$OUT/logcat.txt" "$OUT/crash-buffer.txt"; then
            echo 'FATAL_RUNTIME_ERROR_WITHIN_60S' | tee -a "$OUT/runtime-result.txt"
            exit 70
          fi
          echo 'ANDROID16_NATIVE_ARM64_CONTINUOUS_60S_RUNTIME_OK' | tee -a "$OUT/runtime-result.txt"

      - name: Upload candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuper-vod-media-fallback-native-arm64
          path: |
            diagnostics-vod-media-fallback/**
            host.txt
            device-abi*.txt
            emulator.log
          retention-days: 7
