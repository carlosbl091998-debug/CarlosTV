name: Test Xuper VOD v9 runtime fallback on Android 16

on:
  workflow_dispatch:
  push:
    branches: [magis-frida-spawn-v2]
    paths:
      - 'tools/build_vod_v9_gadget.sh'
      - '.github/workflows/test-vod-v9-gadget.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build VOD v9 runtime fallback candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/build_vod_v9_gadget.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Validate install, boot, hook and 60s stability on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euxo pipefail
            APK='diagnostics-vod-v9-gadget/Xuper-VOD-v9-Gadget-Candidate.apk'
            PKG='com.msandroid.mobile'
            adb install -r -g "$APK" | tee diagnostics-vod-v9-gadget/install.txt
            adb logcat -c
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 > diagnostics-vod-v9-gadget/launch.txt 2>&1 || true
            sleep 20
            PID20=$(adb shell pidof "$PKG" | tr -d '\r' || true)
            adb exec-out screencap -p > diagnostics-vod-v9-gadget/screen-20.png || true
            sleep 40
            PID60=$(adb shell pidof "$PKG" | tr -d '\r' || true)
            adb exec-out screencap -p > diagnostics-vod-v9-gadget/screen-60.png || true
            adb logcat -d -v threadtime > diagnostics-vod-v9-gadget/logcat.txt || true
            echo "pid20=$PID20 pid60=$PID60" | tee diagnostics-vod-v9-gadget/runtime-result.txt
            test -n "$PID20"
            test -n "$PID60"
            if grep -Eqi 'FATAL EXCEPTION|UnsatisfiedLinkError|SIGABRT|Fatal signal' diagnostics-vod-v9-gadget/logcat.txt; then
              grep -Ein 'FATAL EXCEPTION|UnsatisfiedLinkError|SIGABRT|Fatal signal' diagnostics-vod-v9-gadget/logcat.txt | tail -50
              exit 70
            fi
            # The protected app loads cb.z1 after its loader initializes. Record whether Gadget announced the hook.
            grep -Ei 'XUPER_VOD_FIX|frida|gadget' diagnostics-vod-v9-gadget/logcat.txt | tail -200 > diagnostics-vod-v9-gadget/gadget-log.txt || true
            echo 'ANDROID16_STABILITY_OK' | tee -a diagnostics-vod-v9-gadget/runtime-result.txt

      - name: Upload tested candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuper-vod-v9-gadget-candidate
          path: diagnostics-vod-v9-gadget/**
          retention-days: 7
