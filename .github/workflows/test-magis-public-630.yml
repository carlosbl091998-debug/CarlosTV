name: Runtime test alternate Magis 6.3.0

on:
  push:
    branches: [magis-630-resource-patch-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Download alternate 6.3.0 candidate
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 \
            'https://d.imagstvapk.com/imagstvapk.com_magis-celular_vlatest.apk' \
            -o magis-public.apk
          unzip -t magis-public.apk >/dev/null
          sha256sum magis-public.apk | tee candidate-sha.txt
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging magis-public.apk | head -30 | tee candidate-badging.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs magis-public.apk | tee candidate-cert.txt

      - name: Android 16 runtime probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/test_magis_public_candidate.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magis-public-630-runtime-diagnostics
          if-no-files-found: ignore
          path: |
            candidate-sha.txt
            candidate-badging.txt
            candidate-cert.txt
            magis-public-diagnostics/**
          retention-days: 2
