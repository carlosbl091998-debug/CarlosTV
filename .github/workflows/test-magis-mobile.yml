name: Test Magis official mobile update chain

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-magis-official-update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Download signed Magis bootstrap candidate
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4 --retry-all-errors -A 'Mozilla/5.0' \
            'https://tinyurl.com/Magis-TV-File' -o magis-current.apk
          unzip -t magis-current.apk >/dev/null
          sha256sum magis-current.apk | tee magis-current.sha256

      - name: Validate package and signing identity
        shell: bash
        run: |
          set -euxo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging magis-current.apk | tee magis-badging.txt
          grep -q "package: name='com.msandroid.mobile'" magis-badging.txt
          "$APKSIGNER" verify --verbose --print-certs magis-current.apk | tee magis-signing.txt
          mkdir -p diagnostics-update
          cp magis-current.sha256 magis-badging.txt magis-signing.txt diagnostics-update/

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Follow Magis official update flow and smoke test result
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/test_magis_update_chain.sh

      - name: Remove third-party APK binaries from diagnostics
        if: always()
        shell: bash
        run: |
          find diagnostics-update -type f -name '*.apk' -delete 2>/dev/null || true

      - name: Upload update diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magis-official-update-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: diagnostics-update/**
