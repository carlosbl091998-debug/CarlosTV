name: Test exact Magis 6.3.0 without updating

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  magis-630-keep-magis:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Download exact public Magis 6.3.0 candidate
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4 --retry-all-errors -A 'Mozilla/5.0' \
            'https://magisapktv.com/files/magis-celular-magisapktv.com.apk' -o magis-630.apk
          unzip -t magis-630.apk >/dev/null
          echo 'd4edfc8ee9fbc008f9daa2cbb3aac733939987b7570bfc58a7065ebecfaa510a  magis-630.apk' | sha256sum -c -

      - name: Verify package/version/signature
        shell: bash
        run: |
          set -euxo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging magis-630.apk | tee magis-630-badging.txt
          grep -q "package: name='com.msandroid.mobile'" magis-630-badging.txt
          grep -q "versionName='6.3.0'" magis-630-badging.txt
          "$APKSIGNER" verify --verbose --print-certs magis-630.apk | tee magis-630-signing.txt
          grep -qi 'd30dc60fd8625d49fa4e82eb442c9307743f9621004b94e229dcc01f6a9035ff' magis-630-signing.txt
          mkdir -p diagnostics-magis-630
          cp magis-630-badging.txt magis-630-signing.txt diagnostics-magis-630/

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run Magis 6.3.0 and refuse update
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/test_magis_630_keep_magis.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magis-630-keep-magis-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: diagnostics-magis-630/**
